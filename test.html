<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>HDR 背景测试</title>
  <script type="importmap">
  {
    "imports": {
      "three": "/three/three.module.js",
      "examples/": "/three/examples/jsm/"
    }
  }
  </script>
  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; background:#000;}
    body { overflow:hidden; }
    canvas { display:block; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { RGBELoader } from 'examples/loaders/RGBELoader.js';

    let scene = new THREE.Scene();

    let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 2);

    let renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 加载 HDR 贴图，设置为背景
    new RGBELoader().load('/textures/skybox.hdr', function(texture) {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = texture;
      scene.background = texture;
      render();
      // 打印下是否加载成功
      console.log('HDR loaded:', texture);
    });

    function render() {
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      render();
    });
  </script>
</body>
</html>
