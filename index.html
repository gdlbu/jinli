<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>锦鲤 jin.li</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87CEEB; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#fff;
      background:#0077be; z-index:100;
      opacity: 1;
      transition: opacity 0.8s cubic-bezier(.45,0,.55,1);
      pointer-events: auto;
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    canvas { display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/three/three.module.js",
      "three/": "/three/",
      "examples/": "/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'examples/controls/OrbitControls.js';
    import { GLTFLoader }  from 'examples/loaders/GLTFLoader.js';
    import { Water }       from 'examples/objects/Water.js';
    import { RGBELoader }  from 'examples/loaders/RGBELoader.js';
    import { FontLoader }  from 'examples/loaders/FontLoader.js';
    import { TextGeometry } from 'examples/geometries/TextGeometry.js';

    let scene, camera, renderer, clock, mixer, water;
    let koi, textMesh;
    const loadingDiv = document.getElementById('loading');

    let resourcesLoaded = 0;
    const totalResources = 4; // skybox.hdr、waternormals.jpg、koi.glb、font

    function tryHideLoading() {
      resourcesLoaded++;
      if (resourcesLoaded >= totalResources) {
        loadingDiv.classList.add('hide');
        setTimeout(() => { loadingDiv.style.display = 'none'; }, 800);
      }
    }

    init();
    animate();

    function init() {
      if (window.location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器打开此页面';
        return;
      }

      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(1, 12, 3);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, canvas: document.getElementById('canvas') });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.95;
      renderer.setClearColor(0x0077be, 1);

      // 环境贴图建议为明亮水色/天空HDR
      new RGBELoader().load('/textures/skybox.hdr', function (texture) {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        scene.environment = texture;
        scene.background = texture;
        tryHideLoading();
      });

      const sunPos = new THREE.Vector3().setFromSphericalCoords(1, Math.PI * 0.4, Math.PI * 0.25);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x444488, 0.25));
      const dirLight = new THREE.DirectionalLight(0xfff4e0, 1.15);
      dirLight.position.copy(sunPos).multiplyScalar(60);
      dirLight.castShadow = true;
      scene.add(dirLight);
      const rimLight = new THREE.DirectionalLight(0xbfdfff, 0.5);
      rimLight.position.set(-10, 15, -15);
      scene.add(rimLight);

      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: 0xDDCBA0, roughness: 1 })
      );
      sand.rotation.x = -Math.PI/2;
      scene.add(sand);

      const waterGeo = new THREE.PlaneGeometry(200, 200);
      const waterNormals = new THREE.TextureLoader().load(
        '/textures/waternormals.jpg',
        tex => {
          tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
          tex.repeat.set(16, 16);
          tryHideLoading();
        }
      );
      water = new Water(waterGeo, {
        textureWidth: 512,
        textureHeight: 512,
        waterNormals,
        sunDirection: sunPos.clone().normalize(),
        sunColor: 0xffffff,
        waterColor: 0x40E0D0,
        distortionScale: 3.2,
        fog: false
      });
      water.rotation.x = -Math.PI/2;
      water.position.y = 0.1;
      water.material.transparent = true;
      water.material.opacity = 0.95;
      scene.add(water);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 加载锦鲤模型
      const loader = new GLTFLoader();
      loader.load(
        '/models/koi.glb',
        gltf => {
          gltf.scene.rotation.y = Math.PI;
          mixer = new THREE.AnimationMixer(gltf.scene);
          gltf.animations.forEach(c => mixer.clipAction(c).play());
          gltf.scene.scale.set(12, 12, 12);
          gltf.scene.position.y = water.position.y + 1;
          gltf.scene.traverse(n => {
            if (n.isMesh) {
              n.castShadow = true;
              if(n.material) {
                if("metalness" in n.material) n.material.metalness = 0.15;
                if("roughness" in n.material) n.material.roughness = 0.4;
                if(n.material.emissive) {
                  n.material.emissive.setHex(0xffe8d0);
                  n.material.emissiveIntensity = 0.05;
                }
              }
            }
          });
          koi = gltf.scene;
          scene.add(koi);
          tryHideLoading();

          // 加载字体和生成黄色水晶3D字
          const fontLoader = new FontLoader();
          fontLoader.load('/fonts/jinli.typeface.json', function(font) {
            const textGeo = new TextGeometry('锦鲤 jin.li', {
              font: font,
              size: 0.5,
              height: 0.01,
              curveSegments: 3,
              bevelEnabled: false
            });
            textGeo.computeBoundingBox();

            // 居中
            const bbox = textGeo.boundingBox;
            const centerX = (bbox.max.x + bbox.min.x) / 2;
            const centerZ = (bbox.max.z + bbox.min.z) / 2;
            textGeo.translate(-centerX, 0, -centerZ);

            // 黄色水晶物理材质
            const textMat = new THREE.MeshPhysicalMaterial({
              color: 0xffeb61,           // 明黄色
              metalness: 0.0,
              roughness: 0.04,
              clearcoat: 1.0,
              clearcoatRoughness: 0.01,
              transmission: 1.0,
              ior: 1.53,
              thickness: 0.17,
              envMapIntensity: 1.2,
              specularIntensity: 0.85
            });
            textMesh = new THREE.Mesh(textGeo, textMat);
            textMesh.scale.z = 0.003;
            scene.add(textMesh);

            updateTextPosition();
            tryHideLoading();
          }, undefined, () => {
            loadingDiv.innerText = '🚨 字体加载失败';
          });
        },
        xhr => {
          if (xhr.lengthComputable) {
            const pct = Math.round(xhr.loaded / xhr.total * 100);
            loadingDiv.innerText = `加载中… ${pct}%`;
          } else {
            const kb = (xhr.loaded / 1024).toFixed(1);
            loadingDiv.innerText = `加载中… ${kb} KB`;
          }
        },
        err => loadingDiv.innerText = '🚨 模型加载失败'
      );

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function updateTextPosition() {
      if (!koi || !textMesh) return;
      // 获取鱼的世界坐标
      const fishWorldPos = new THREE.Vector3();
      koi.getWorldPosition(fishWorldPos);
      // 鱼头朝向 -Z 轴
      const fishDirection = new THREE.Vector3(0, 0, -1);
      fishDirection.applyQuaternion(koi.quaternion);

      // 字放在鱼头正前方3单位，可调节距离
      const textPos = fishWorldPos.clone().add(fishDirection.multiplyScalar(3));
      textPos.y = water.position.y + 0.6; // 高度略高于湖面
      textMesh.position.copy(textPos);

      // 平铺湖面
      textMesh.rotation.set(-Math.PI / 2, 0, 0);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      mixer && mixer.update(dt);
      water && water.material.uniforms && (water.material.uniforms.time.value += dt*.4);

      updateTextPosition();

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
