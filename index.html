<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D 锦鲤池 · 双层水面版（动态水面+可见水下）</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87CEEB; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#fff;
      background:#0077be; z-index:100;
    }
    canvas { display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/",
      "examples/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'examples/controls/OrbitControls.js';
    import { GLTFLoader }    from 'examples/loaders/GLTFLoader.js';
    import { Sky }           from 'examples/objects/Sky.js';
    import { Water }         from 'examples/objects/Water.js';

    let scene, camera, renderer, clock, mixer;
    const loadingDiv = document.getElementById('loading');

    let sunPos; // 供两层水面公用

    init();
    animate();

    function init() {
      if (window.location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器打开此页面';
        return;
      }

      // 场景 & 时钟 & 相机
      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(3, 10, 5);
      camera.lookAt(0, 1, 0); // 视角略偏高

      // 渲染器
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, canvas: document.getElementById('canvas') });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.62;
      renderer.setClearColor(0x87ceeb, 1);

      // Sky Dome
      const sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);
      const su = sky.material.uniforms;
      su.turbidity.value = 2.0;
      su.rayleigh.value = 6.0;
      su.mieCoefficient.value = 0.0015;
      su.mieDirectionalG.value = 0.8;
      sunPos = new THREE.Vector3().setFromSphericalCoords(1, Math.PI * 0.31, Math.PI * 0.22);
      su.sunPosition.value.copy(sunPos);

      // 环境贴图 & 背景
      const pmremGen = new THREE.PMREMGenerator(renderer);
      const envMap = pmremGen.fromScene(sky).texture;
      scene.environment = envMap;
      scene.background = sky;

      loadingDiv.style.display = 'none';

      // 光照
      scene.add(new THREE.HemisphereLight(0xffffff, 0x8de3bf, 0.50));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
      dirLight.position.copy(sunPos).multiplyScalar(50);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // 沙底
      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: 0xb6d6c6, roughness: 0.5 })
      );
      sand.rotation.x = -Math.PI/2;
      sand.position.y = 0;
      scene.add(sand);

      // === 1. 底层透明水面（可见水下物体） ===
      const baseWater = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshPhysicalMaterial({
          color: 0x14b2a4,
          transparent: true,
          opacity: 0.25,
          roughness: 0.3,
          metalness: 0.1,
          reflectivity: 0.7,
          clearcoat: 1.0,
          clearcoatRoughness: 0.2
        })
      );
      baseWater.rotation.x = -Math.PI / 2;
      baseWater.position.y = 2.0;
      baseWater.renderOrder = 0;
      scene.add(baseWater);

      // === 2. 上层动态波纹水面 Water.js ===
      const waterNormals = new THREE.TextureLoader().load(
        'https://threejs.org/examples/textures/waternormals.jpg',
        tex => { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(16, 16); }
      );
      const water = new Water(
        new THREE.PlaneGeometry(200, 200),
        {
          textureWidth: 2048,
          textureHeight: 2048,
          waterNormals,
          sunDirection: sunPos.clone().normalize(),
          sunColor: 0xffffff,
          waterColor: 0x14b2a4,
          distortionScale: 1.2,
          fog: false
        }
      );
      water.rotation.x = -Math.PI / 2;
      water.position.y = 2.01; // 比底层略高
      water.material.transparent = true;
      water.material.opacity = 0.33;
      water.material.side = THREE.FrontSide;
      water.renderOrder = 1;
      scene.add(water);

      // 控制器
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 加载锦鲤模型 & 初始朝向调整
      const loader = new GLTFLoader();
      loader.load(
        'koi.glb',
        gltf => {
          gltf.scene.rotation.y = Math.PI;
          mixer = new THREE.AnimationMixer(gltf.scene);
          gltf.animations.forEach(c => mixer.clipAction(c).play());
          gltf.scene.scale.set(12, 12, 12);
          // 让锦鲤在水下（比如池底上方一点）
          gltf.scene.position.y = 1.3; // 沙底0，水面2.0-2.01，鱼1.3为水下约0.7
          gltf.scene.traverse(n => n.isMesh && (n.castShadow = true));
          scene.add(gltf.scene);
          loadingDiv.style.display = 'none';
        },
        xhr => {
          if (xhr.lengthComputable) {
            const pct = Math.round(xhr.loaded / xhr.total * 100);
            loadingDiv.innerText = `加载中… ${pct}%`;
          } else {
            const kb = (xhr.loaded / 1024).toFixed(1);
            loadingDiv.innerText = `加载中… ${kb} KB`;
          }
        },
        err => loadingDiv.innerText = '🚨 模型加载失败'
      );

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // 动态水面动画同步
      window._water = water; // debug用
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      mixer && mixer.update(dt);
      // Water.js 动态波
      if (scene && scene.children) {
        for (let i = 0; i < scene.children.length; i++) {
          const obj = scene.children[i];
          if (obj.material && obj.material.uniforms && obj.material.uniforms.time) {
            obj.material.uniforms.time.value += dt;
          }
        }
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
