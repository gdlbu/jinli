<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>极致真实·3D 锦鲤池（HDR 修正版）</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#333;
      background:#faf8f2; z-index:100;
    }
    canvas { display:block }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载环境…</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader }   from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { RGBELoader }   from 'three/examples/jsm/loaders/RGBELoader.js';
    import { Water }        from 'three/examples/jsm/objects/Water.js';

    let scene, camera, renderer, clock, mixer, water;
    const loading = document.getElementById('loading');
    const canvas  = document.getElementById('canvas');

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 2000);
      camera.position.set(0, 8, 20);

      renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

      // 环境贴图：使用 threejs.org 上的 HDR 资源
      const pmrem = new THREE.PMREMGenerator(renderer);
      new RGBELoader()
        .setDataType(THREE.UnsignedByteType)
        .load(
          'https://threejs.org/examples/textures/equirectangular/royal_esplanade_1k.hdr',
          hdr => {
            const envMap = pmrem.fromEquirectangular(hdr).texture;
            scene.environment = envMap;
            scene.background  = envMap;
            hdr.dispose();
            pmrem.dispose();
            loading.innerText = '加载水面…';
            initWater();
            loading.innerText = '加载锦鲤…';
            initKoi();
          },
          undefined,
          err => {
            console.error('HDR 加载失败', err);
            loading.innerText = '⚠️ HDR 加载失败';
          }
        );

      window.addEventListener('resize', onResize);
    }

    function initWater() {
      const geo = new THREE.PlaneGeometry(200,200);
      const normals = new THREE.TextureLoader().load(
        'https://threejs.org/examples/textures/waternormals.jpg',
        tex => tex.wrapS = tex.wrapT = THREE.RepeatWrapping
      );
      water = new Water(geo, {
        textureWidth: 512,
        textureHeight: 512,
        waterNormals: normals,
        sunDirection: new THREE.Vector3(0.3,1,0.3).normalize(),
        sunColor: 0xffffff,
        waterColor: 0x1EB980,
        distortionScale: 1.5,
        fog: false
      });
      water.rotation.x = -Math.PI/2;
      water.position.y = 0;
      scene.add(water);

      // 调试控制
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.maxPolarAngle = Math.PI/2 - 0.1;
    }

    function initKoi() {
      new THREE.GLTFLoader().load(
        `${window.location.origin}/koi.glb`,
        gltf => {
          loading.style.display = 'none';
          const model = gltf.scene;
          model.scale.set(12,12,12);
          model.position.y = 1.5;
          model.traverse(n=> n.isMesh && (n.castShadow=true));
          scene.add(model);

          mixer = new THREE.AnimationMixer(model);
          console.log('动画片段：', gltf.animations.map(a=>a.name));
          gltf.animations.forEach(clip => mixer.clipAction(clip).play());

          window.addEventListener('pointerdown', ()=>{
            const clip = gltf.animations.find(c=>/flee/i.test(c.name));
            if (clip) {
              const action = mixer.clipAction(clip);
              action.reset().play();
              action.clampWhenFinished = true;
              action.loop = THREE.LoopOnce;
            }
          });
        },
        xhr => {
          const pct = xhr.total ? Math.round(xhr.loaded/xhr.total*100) : 0;
          loading.innerText = `加载锦鲤… ${pct}%`;
        },
        err => {
          console.error('锦鲤加载失败', err);
          loading.innerText = '⚠️ 锦鲤加载失败';
        }
      );
    }

    function onResize() {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      if (water) water.material.uniforms['time'].value += dt;
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
