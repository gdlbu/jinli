<style>
  :root{
    /* —— 昼间池水 —— */
    --water-deep:#1c6f6d;
    --water-mid:#3aa89f;
    --water-bright:#8fe7da;
    /* —— 器物 —— */
    --seal:#c0392b;        /* 印章朱红 */
    --koi-red:#e5432c;
    --koi-gold:#f2a92e;
    --gold:#c9a86a;        /* 金线 */
    --paper:#f5efe1;       /* 宣纸 */
    --ink:#0c2b2a;         /* 墨绿 */
    --ui:#f3ede0;          /* 水面上的浅色文字 */
    --ui-dim:rgba(243,237,224,.66);
    --shadow:0 2px 18px rgba(2,26,28,.45);
    --serif:"Noto Serif SC","Songti SC","STSong","SimSun",ST宋体,serif;
    --brush:"Ma Shan Zheng","Noto Serif SC",cursive,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b2f38;}
  body{font-family:var(--serif);color:var(--ui);}
  canvas#scene{display:block;position:fixed;inset:0;width:100%;height:100%;}

  /* ————— 加载：宣纸底 + 朱红印章 + 环形进度 ————— */
  #loading{
    position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;
    background:radial-gradient(120% 120% at 50% 42%,#3aa89f 0%,#2b8f8b 42%,#1c6f6d 78%,#155a5c 100%);
    transition:opacity 1s cubic-bezier(.45,0,.55,1);
  }
  #loading.hide{opacity:0;pointer-events:none;}
  .seal-wrap{position:relative;width:132px;height:132px;display:grid;place-items:center;}
  .seal-wrap .ring{position:absolute;inset:0;transform:rotate(-90deg);}
  .seal-wrap .ring circle{fill:none;stroke-width:2;}
  .seal-wrap .ring .bg{stroke:rgba(245,239,225,.18);}
  .seal-wrap .ring .fg{stroke:var(--paper);stroke-linecap:round;
    stroke-dasharray:383;stroke-dashoffset:383;transition:stroke-dashoffset .4s ease;}
  .seal-badge{
    width:92px;height:92px;border-radius:15px;background:var(--seal);
    display:grid;place-items:center;box-shadow:0 6px 26px rgba(120,20,10,.5),inset 0 0 0 2px rgba(255,255,255,.14);
    animation:seal-breathe 3.4s ease-in-out infinite;
  }
  .seal-badge b{
    font-family:var(--serif);font-weight:600;color:var(--paper);
    font-size:26px;line-height:1;letter-spacing:2px;
    display:flex;flex-direction:column;gap:3px;text-align:center;
    text-shadow:0 1px 2px rgba(90,10,4,.6);
  }
  @keyframes seal-breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}
  #loading .cap{font-size:14px;letter-spacing:.32em;color:var(--ui-dim);font-weight:300;padding-left:.32em;}
  #loading .pct{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ui-dim);letter-spacing:.1em;margin-top:-14px;}

  /* ————— 四角界面 ————— */
  .ui{position:fixed;z-index:20;opacity:0;transition:opacity 1.4s ease .3s;}
  body.ready .ui{opacity:1;}
  .ui.tl{top:max(22px,env(safe-area-inset-top));left:max(22px,env(safe-area-inset-left));}
  .ui.tr{top:max(22px,env(safe-area-inset-top));right:max(22px,env(safe-area-inset-right));display:flex;gap:10px;}
  .ui.bl{left:max(24px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));}
  .ui.br{right:max(22px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));}

  /* 左上：印章 logo */
  .brand{display:flex;align-items:center;gap:13px;user-select:none;}
  .brand .stamp{
    width:46px;height:46px;border-radius:9px;background:var(--seal);
    display:grid;place-items:center;box-shadow:0 4px 16px rgba(120,20,10,.42),inset 0 0 0 1.5px rgba(255,255,255,.16);
  }
  .brand .stamp b{font-weight:600;color:var(--paper);font-size:12px;line-height:1.05;text-align:center;letter-spacing:1px;}
  .brand .words{line-height:1.15;text-shadow:var(--shadow);}
  .brand .words .domain{font-size:21px;font-weight:500;letter-spacing:.1em;font-family:var(--serif);}

  /* 右上：圆形玻璃按钮 */
  .gbtn{
    width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(12,43,42,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:inset 0 0 0 1px rgba(243,237,224,.22),var(--shadow);
    color:var(--ui);display:grid;place-items:center;transition:background .25s,transform .15s;
    font-family:var(--serif);font-size:13px;font-weight:500;letter-spacing:.04em;
  }
  .gbtn:hover{background:rgba(12,43,42,.46);}
  .gbtn:active{transform:scale(.93);}
  .gbtn svg{width:20px;height:20px;stroke:var(--ui);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .gbtn .off{display:none;}
  .gbtn.muted .on{display:none;}.gbtn.muted .off{display:block;}

  /* 右下：求好运主按钮 */
  .seek{
    position:relative;cursor:pointer;border:none;padding:15px 30px 15px 26px;border-radius:40px;
    background:linear-gradient(160deg,#f7f1e4,#ece2cc);color:var(--seal);
    font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.26em;padding-right:calc(30px - .26em);
    box-shadow:0 8px 30px rgba(2,26,28,.4),inset 0 0 0 1.5px var(--gold);
    display:flex;align-items:center;gap:11px;transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;
  }
  .seek:hover{transform:translateY(-2px);box-shadow:0 12px 38px rgba(2,26,28,.5),inset 0 0 0 1.5px var(--gold);}
  .seek:active{transform:translateY(0) scale(.97);}
  .seek .koi-dot{width:20px;height:20px;flex:none;}
  .seek::after{content:"";position:absolute;inset:0;border-radius:40px;box-shadow:0 0 0 0 rgba(201,168,106,.55);animation:pulse 3.6s ease-out infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,168,106,.5);}70%,100%{box-shadow:0 0 0 16px rgba(201,168,106,0);}}

  /* 左下：一句话 */
  .tagline{font-size:13px;letter-spacing:.24em;color:var(--ui-dim);text-shadow:var(--shadow);padding-left:.24em;line-height:1.9;}
  .tagline .en{font-size:10px;letter-spacing:.3em;opacity:.8;}

  /* 首屏标题（中央偏上，几秒后隐去） */
  .hero{position:fixed;z-index:15;top:50%;left:50%;transform:translate(-50%,-58%);text-align:center;
    pointer-events:none;opacity:0;transition:opacity 2s ease;text-shadow:0 3px 30px rgba(2,26,28,.6);}
  body.ready .hero{opacity:1;}
  body.dismiss-hero .hero{opacity:0;transition:opacity 1.2s ease;}
  .hero .big{font-family:var(--brush);font-size:clamp(76px,17vw,168px);line-height:.92;color:var(--paper);letter-spacing:.06em;}
  .hero .sub{margin-top:14px;font-size:clamp(13px,2.4vw,17px);letter-spacing:.5em;color:var(--ui-dim);padding-left:.5em;font-weight:300;}

  /* ————— 签文卡片 ————— */
  .fortune-mask{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(4,24,26,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .5s ease;padding:20px;}
  .fortune-mask.show{display:flex;opacity:1;}
  .card{position:relative;width:min(360px,90vw);border-radius:16px;overflow:hidden;
    transform:translateY(24px) scale(.96);transition:transform .6s cubic-bezier(.16,1,.3,1);
    box-shadow:0 30px 80px rgba(0,0,0,.5);}
  .fortune-mask.show .card{transform:none;}
  #cardCanvas{display:block;width:100%;height:auto;}
  .card-actions{display:flex;gap:12px;justify-content:center;margin-top:22px;opacity:0;transition:opacity .6s ease .3s;}
  .fortune-mask.show .card-actions{opacity:1;}
  .pill{cursor:pointer;border:none;padding:12px 22px;border-radius:30px;font-family:var(--serif);
    font-size:14px;letter-spacing:.14em;padding-right:calc(22px - .14em);transition:transform .15s,background .2s;}
  .pill:active{transform:scale(.95);}
  .pill.solid{background:var(--paper);color:var(--seal);font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 0 0 1.4px var(--gold);}
  .pill.ghost{background:rgba(243,237,224,.12);color:var(--ui);box-shadow:inset 0 0 0 1px rgba(243,237,224,.3);}
  .card-close{position:fixed;top:max(22px,env(safe-area-inset-top));right:max(22px,env(safe-area-inset-right));z-index:41;}

  .wrap-center{display:flex;flex-direction:column;align-items:center;}

  /* 降级 / 无 WebGL */
  #fallback{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;text-align:center;padding:30px;background:radial-gradient(120% 120% at 50% 40%,#2b8f8b,#155a5c);}
  #fallback.show{display:flex;}
  #fallback .big{font-family:var(--brush);font-size:96px;color:var(--paper);}
  #fallback p{color:var(--ui-dim);letter-spacing:.2em;font-size:14px;max-width:22em;line-height:2;}

  .hint{position:fixed;left:50%;bottom:max(96px,calc(env(safe-area-inset-bottom) + 96px));transform:translateX(-50%);
    z-index:16;font-size:12px;letter-spacing:.22em;color:var(--ui-dim);text-shadow:var(--shadow);
    opacity:0;transition:opacity 1s ease;pointer-events:none;padding-left:.22em;}
  body.ready .hint.show{opacity:1;}

  @media (max-width:560px){
    .seek{font-size:15px;padding:13px 24px 13px 20px;}
    .tagline .en{display:none;}
  }
  @media (prefers-reduced-motion:reduce){
    .seal-badge,.seek::after{animation:none;}
  }
</style>
</head>

    <button class="gbtn" id="langBtn" title="语言" aria-label="切换语言">中</button>

  <div class="ui bl">

  <div class="ui br">

      <span data-i18n="seek">求好运</span>
    </button>
  </div>

  <div class="hint" id="hint" data-i18n="hint">轻触水面 · 锦鲤游来</div>

  <!-- 签文卡片 -->
  <div class="fortune-mask" id="fmask">
    <div class="wrap-center">
      <div class="card"><canvas id="cardCanvas" width="720" height="1160"></canvas></div>
      <div class="card-actions">
        <button class="pill solid" id="saveBtn" data-i18n="save">保存好运</button>
        <button class="pill ghost" id="againBtn" data-i18n="again">再求一签</button>

    <button class="gbtn card-close" id="closeBtn" aria-label="关闭">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <!-- 降级 -->
  <div id="fallback">
    <div class="big">锦鲤</div>
    <p data-i18n="fallback">你的设备暂不支持 3D 池水。<br>但好运不打折——愿好运常伴。</p>
  </div>
