<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>锦鲤 jin.li</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#fff;
      background:transparent !important; /* 一定透明 */
      z-index:100;
      opacity: 1;
      transition: opacity 0.8s cubic-bezier(.45,0,.55,1);
      pointer-events: auto;
      text-shadow: 0 2px 8px #206668, 0 1px 2px #43b9b6;
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    /* 不要给canvas全局样式 */
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/three/three.module.js",
      "three/": "/three/",
      "examples/": "/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <!-- three.js 用于3D的canvas，只负责3D显示 -->
  <canvas id="canvas"></canvas>
  <script>
  // 动画水面背景canvas，独立于three.js
  window.addEventListener('DOMContentLoaded', () => {
    // 1. 创建并插入背景canvas
    const bgCanvas = document.createElement('canvas');
    bgCanvas.width = window.innerWidth * 2;
    bgCanvas.height = window.innerHeight * 2;
    bgCanvas.style.width = '100vw';
    bgCanvas.style.height = '100vh';
    bgCanvas.style.position = 'fixed';
    bgCanvas.style.top = 0;
    bgCanvas.style.left = 0;
    bgCanvas.style.zIndex = -1;
    document.body.insertBefore(bgCanvas, document.body.firstChild);

    const ctx = bgCanvas.getContext('2d');
    const getSize = () => [bgCanvas.width, bgCanvas.height];

    // 波光参数
    let W = bgCanvas.width, H = bgCanvas.height;
    let spots = Array.from({length: 15}).map((_, i) => ({
      x: Math.random() * W,
      y: Math.random() * H * 0.8 + H * 0.1,
      rx: 50 + Math.random() * 70,
      ry: 38 + Math.random() * 48,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 0.8,
      color: Math.random() > 0.5 ? '#c9fff4' : '#d3fff8',
      alpha: 0.04 + Math.random() * 0.04
    }));

    function draw(t) {
      // 更新尺寸
      [W, H] = getSize();
      // 1. 主渐变
      const grad = ctx.createRadialGradient(
        W/2, H*0.52, W*0.03,
        W/2, H/2, W/1.01
      );
      grad.addColorStop(0.00, '#82e5dc');
      grad.addColorStop(0.20, '#63d1c9');
      grad.addColorStop(0.46, '#51bfc1');
      grad.addColorStop(0.85, '#3baab2');
      grad.addColorStop(1.00, '#229c9b');
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // 2. 动态波光
      spots.forEach((s, i) => {
        ctx.save();
        ctx.globalAlpha = s.alpha * (0.85 + 0.15 * Math.sin(t * 0.001 * s.speed + s.phase));
        ctx.filter = `blur(${15 + Math.sin(t * 0.001 * (s.speed + i)) * 5}px)`;
        ctx.beginPath();
        // 水波缓慢浮动（y轴+椭圆大小有细微变化）
        const yFloat = s.y + Math.sin(t * 0.0004 + s.phase + i) * 10;
        const rx = s.rx + Math.sin(t * 0.0006 + i) * 3;
        const ry = s.ry + Math.cos(t * 0.0006 + i) * 2.5;
        ctx.ellipse(s.x, yFloat, rx, ry, s.phase + Math.sin(t * 0.0003 + i), 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.fill();
        ctx.restore();
      });

      ctx.globalAlpha = 1;
      ctx.filter = 'none';
      requestAnimationFrame(draw);
    }
    draw(0);

    // 响应窗口缩放
    window.addEventListener('resize', () => {
      bgCanvas.width = window.innerWidth * 2;
      bgCanvas.height = window.innerHeight * 2;
      // 重置波光位置
      W = bgCanvas.width; H = bgCanvas.height;
      spots = Array.from({length: 15}).map((_, i) => ({
        x: Math.random() * W,
        y: Math.random() * H * 0.8 + H * 0.1,
        rx: 50 + Math.random() * 70,
        ry: 38 + Math.random() * 48,
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 0.8,
        color: Math.random() > 0.5 ? '#c9fff4' : '#d3fff8',
        alpha: 0.04 + Math.random() * 0.04
      }));
    });

    // loading 遮罩透明
    const loadingDiv = document.getElementById('loading');
    if (loadingDiv) {
      loadingDiv.style.background = 'transparent';
    }
  });
  </script>

  <!-- three.js 3D场景，透明渲染 -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'examples/controls/OrbitControls.js';
    import { GLTFLoader } from 'examples/loaders/GLTFLoader.js';
    import { Water } from 'examples/objects/Water.js';
    import { RGBELoader } from 'examples/loaders/RGBELoader.js';

    let scene, camera, renderer, clock, mixer, water;
    const loadingDiv = document.getElementById('loading');
    let resourcesLoaded = 0;
    const totalResources = 3; // skybox.hdr、waternormals.jpg、koi.glb

    function tryHideLoading() {
      resourcesLoaded++;
      if (resourcesLoaded >= totalResources) {
        loadingDiv.classList.add('hide');
        setTimeout(() => { loadingDiv.style.display = 'none'; }, 800);
      }
    }

    init();
    animate();

    function init() {
      if (window.location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器打开此页面';
        return;
      }

      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(1, 12, 3);
      camera.lookAt(0, 0, 0);

      // alpha:true, 让三维canvas透明，不覆盖动画水面
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        canvas: document.getElementById('canvas')
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.6;
      // 不要 setClearColor

      // 环境贴图
      new RGBELoader().load('/textures/skybox.hdr', function (texture) {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        scene.environment = texture;
        scene.background = texture;
        tryHideLoading();
      });

      // 灯光
      const sunPos = new THREE.Vector3().setFromSphericalCoords(1, Math.PI * 0.4, Math.PI * 0.25);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444488, 0.25));
      const dirLight = new THREE.DirectionalLight(0xfff4e0, 1.15);
      dirLight.position.copy(sunPos).multiplyScalar(60);
      dirLight.castShadow = true;
      scene.add(dirLight);
      const rimLight = new THREE.DirectionalLight(0xbfdfff, 0.45);
      rimLight.position.set(-10, 15, -15);
      scene.add(rimLight);

      // 沙底
      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: 0xDDCBA0, roughness: 1 })
      );
      sand.rotation.x = -Math.PI/2;
      scene.add(sand);

      // 水面
      const waterGeo = new THREE.PlaneGeometry(200, 200);
      const waterNormals = new THREE.TextureLoader().load(
        '/textures/waternormals.jpg',
        tex => {
          tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
          tex.repeat.set(16, 16);
          tryHideLoading();
        }
      );
      water = new Water(waterGeo, {
        textureWidth: 512,
        textureHeight: 512,
        waterNormals,
        sunDirection: sunPos.clone().normalize(),
        sunColor: 0xffffff,
        waterColor: 0x40E0D0,
        distortionScale: 3.2,
        fog: false
      });
      water.rotation.x = -Math.PI/2;
      water.position.y = 0.1;
      water.material.transparent = true;
      water.material.opacity = 0.95;
      scene.add(water);

      // 控制器
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 锦鲤模型
      const loader = new GLTFLoader();
      loader.load(
        '/models/koi.glb',
        gltf => {
          gltf.scene.rotation.y = Math.PI;
          mixer = new THREE.AnimationMixer(gltf.scene);
          gltf.animations.forEach(c => mixer.clipAction(c).play());
          gltf.scene.scale.set(12, 12, 12);
          gltf.scene.position.y = water.position.y+1;
          gltf.scene.traverse(n => {
            if (n.isMesh) {
              n.castShadow = true;
              if(n.material) {
                if(n.material.emissive) {
                  n.material.emissive.setHex(0xffe8d0);
                  n.material.emissiveIntensity = 0.05;
                }
                if("metalness" in n.material) n.material.metalness = 0.15;
                if("roughness" in n.material) n.material.roughness = 0.4;
              }
            }
          });
          scene.add(gltf.scene);
          tryHideLoading();
        },
        xhr => {
          if (xhr.lengthComputable) {
            const pct = Math.round(xhr.loaded / xhr.total * 100);
            loadingDiv.innerText = `加载中… ${pct}%`;
          } else {
            const kb = (xhr.loaded / 1024).toFixed(1);
            loadingDiv.innerText = `加载中… ${kb} KB`;
          }
        },
        err => loadingDiv.innerText = '🚨 模型加载失败'
      );

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      mixer && mixer.update(dt);
      water && water.material.uniforms && (water.material.uniforms.time.value += dt*.4);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
