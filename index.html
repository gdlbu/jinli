<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>3D 锦鲤池（绝对路径加载）</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    body { background: #faf8f2; overflow:hidden }
    canvas { display:block }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      background:#faf8f2; font-family:sans-serif; font-size:1.2em;
      z-index:100;
    }
  </style>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/controls/OrbitControls.js';

    const loadingDiv = document.getElementById('loading');
    const canvas = document.getElementById('canvas');
    let scene, camera, renderer, clock, mixer, swimAction, fleeAction;

    init();
    animate();

    function init() {
      // Three.js 基础
      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
      camera.position.set(0,5,10);
      renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      // 灯光
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));
      const dl = new THREE.DirectionalLight(0xffffff, 0.8);
      dl.position.set(5,10,7);
      scene.add(dl);

      // 地面
      const gm = new THREE.MeshPhongMaterial({ color:0xe0dfd5, depthWrite:false });
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200), gm);
      ground.rotation.x = -Math.PI/2;
      scene.add(ground);

      // 控制器（可选）
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.maxPolarAngle = Math.PI/2 - 0.1;

      // 模型 URL：绝对路径
      const modelUrl = `${window.location.origin}/koi.glb`;
      console.log('尝试加载模型：', modelUrl);

      const loader = new GLTFLoader();
      loader.load(
        modelUrl,
        gltf => {
          console.log('GLTF 加载成功', gltf);
          loadingDiv.style.display = 'none';
          const model = gltf.scene;
          model.scale.set(2,2,2);
          scene.add(model);

          mixer = new THREE.AnimationMixer(model);
          const clips = gltf.animations;
          swimAction = mixer.clipAction(clips.find(c=>/swim/i.test(c.name)));
          fleeAction = mixer.clipAction(clips.find(c=>/flee/i.test(c.name)));
          swimAction.play();

          window.addEventListener('pointerdown', ()=>{
            console.log('触发逃跑动画');
            fleeAction.reset().play();
            swimAction.stop();
            fleeAction.clampWhenFinished = true;
            fleeAction.loop = THREE.LoopOnce;
            mixer.addEventListener('finished', ()=>{
              console.log('逃跑完成，恢复游动');
              fleeAction.stop();
              swimAction.reset().play();
            });
          });
        },
        xhr => {
          const percent = xhr.total? Math.floor(xhr.loaded/xhr.total*100) : 0;
          loadingDiv.innerText = `加载中… ${percent}%`;
          console.log(`模型加载进度: ${percent}%`);
        },
        err => {
          console.error('模型加载出错：', err);
          loadingDiv.innerText = `🚨 加载失败：${err.message||err}`;
        }
      );

      window.addEventListener('resize', ()=>{
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
