<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>3D 锦鲤池（CDN 绝对导入版）</title>
  <style>
    html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87CEEB }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#333;
      background:#87CEEB; z-index:100;
    }
    canvas { display:block }
  </style>
</head>
<body>
  <div id="loading">加载场景…</div>
  <canvas id="canvas"></canvas>

  <script type="module">
    // **只用绝对 URL**，不写 'three' 也不写相对 js/
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js';
    import { OrbitControls }  from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader }      from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/loaders/GLTFLoader.js';
    import { Water }           from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/objects/Water.js';
    import { Sky }             from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/objects/Sky.js';
    import { EffectComposer }  from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass }      from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/postprocessing/UnrealBloomPass.js';
    import { ShaderPass }      from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/postprocessing/ShaderPass.js';
    import { FXAAShader }      from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/shaders/FXAAShader.js';

    let scene, camera, renderer, clock, mixer, water, composer;
    const loading = document.getElementById('loading');
    const canvas  = document.getElementById('canvas');

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 2000);
      camera.position.set(0, 8, 20);

      renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      renderer.setClearColor(0x87CEEB);

      // 天空 & 太阳
      const sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);
      const sun = new THREE.Vector3().setFromSphericalCoords(1, Math.PI*0.4, Math.PI*0.25);
      sky.material.uniforms['sunPosition'].value.copy(sun);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
      const dirLight = new THREE.DirectionalLight(0xfff8ea, 2.0);
      dirLight.position.copy(sun).multiplyScalar(50);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.set(2048,2048);
      scene.add(dirLight);

      // 地面阴影
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200,200),
        new THREE.ShadowMaterial({ opacity:0.2 })
      );
      ground.rotation.x = -Math.PI/2;
      ground.position.y = -0.1;
      ground.receiveShadow = true;
      scene.add(ground);

      // 水面
      const waterNormals = new THREE.TextureLoader().load(
        'https://threejs.org/examples/textures/waternormals.jpg',
        t=>{ t.wrapS = t.wrapT = THREE.RepeatWrapping; }
      );
      water = new Water(
        new THREE.PlaneGeometry(200,200),
        { 
          textureWidth:512, textureHeight:512,
          waterNormals, sunDirection:sun.clone().normalize(),
          sunColor:0xffffff, waterColor:0x1EB980,
          distortionScale:1.2, fog:false
        }
      );
      water.rotation.x = -Math.PI/2;
      water.position.y = 0;
      scene.add(water);

      // Bloom + FXAA 后处理
      composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloom = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth,window.innerHeight),
        1.2, 0.4, 0.85
      );
      bloom.threshold = 0.2; bloom.strength = 0.8; bloom.radius = 0.6;
      composer.addPass(bloom);
      const fxaa = new ShaderPass(FXAAShader);
      fxaa.uniforms['resolution'].value.set(1/window.innerWidth,1/window.innerHeight);
      composer.addPass(fxaa);

      // 控制
      new OrbitControls(camera, renderer.domElement).enableDamping = true;

      // 加载锦鲤
      new GLTFLoader().load(
        './koi.glb',
        gltf => {
          loading.style.display = 'none';
          const model = gltf.scene;
          model.scale.set(12,12,12);
          model.position.y = 1.5;
          model.traverse(n=>{
            if(n.isMesh){
              n.material = new THREE.MeshPhysicalMaterial({
                map: n.material.map,
                envMap: scene.environment,
                envMapIntensity:1.5,
                metalness:0.2, roughness:0.4,
                clearcoat:0.3, clearcoatRoughness:0.1,
                side: THREE.DoubleSide
              });
              n.castShadow = true;
            }
          });
          scene.add(model);
          mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach(c=> mixer.clipAction(c).play());
          window.addEventListener('pointerdown',()=>{
            const c = gltf.animations.find(a=>/flee/i.test(a.name));
            if(c){
              const act = mixer.clipAction(c);
              act.reset().play();
              act.clampWhenFinished = true;
              act.loop = THREE.LoopOnce;
            }
          });
        },
        xhr=> loading.innerText = `加载锦鲤… ${ Math.round(xhr.loaded/xhr.total*100) }%`,
        err=> {
          console.error(err);
          loading.innerText = '❌ 锦鲤加载失败';
        }
      );

      window.addEventListener('resize', ()=>{
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth,window.innerHeight);
        composer.setSize(window.innerWidth,window.innerHeight);
      });
    }

    function animate(){
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if(mixer) mixer.update(dt);
      if(water) water.material.uniforms['time'].value += dt;
      composer.render();
    }
  </script>
</body>
</html>
