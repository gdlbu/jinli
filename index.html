<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>锦鲤 jin.li</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87CEEB; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#fff;
      background:#208080;   /* 更暗的蓝绿色 */
      z-index:100;
      opacity: 1;
      transition: opacity 0.8s cubic-bezier(.45,0,.55,1);
      pointer-events: auto;
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    canvas { display:block; }
  </style>
  <!-- 其余内容同前，略 -->
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <!-- ...script不变... -->
</body>
</html>
