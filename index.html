<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D 锦鲤池（碧海蓝天 + 果冻海玻璃海效果 + 深色天空背景）</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#fff;
      background:#0077be; z-index:100;
    }
    canvas { display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/",
      "examples/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'examples/controls/OrbitControls.js';
    import { GLTFLoader } from 'examples/loaders/GLTFLoader.js';
    import { Water } from 'examples/objects/Water.js';
    import { Sky } from 'examples/objects/Sky.js';

    let scene, camera, renderer, clock, mixer, water;
    const loadingDiv = document.getElementById('loading');

    init();
    animate();

    function init() {
      if (window.location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器打开此页面';
        return;
      }

      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 20);

      renderer = new THREE.WebGLRenderer({ antialias:true, canvas: document.getElementById('canvas') });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      // 通过曝光调节整体亮度
      // 调低曝光，以免天空过亮
      renderer.toneMappingExposure = 0.6;
      // 深蓝色清空色，保证背景是海天同色
      // 移除静态 clearColor，让背景使用动感环境贴图
      // renderer.setClearColor(0x87CEEB); // 恢复基础蓝色清空，让 sky mesh 可见

      // Sky: 强化蓝天效果
      const sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);
      const su = sky.material.uniforms;
      su['turbidity'].value = 0.2;
      su['rayleigh'].value = 12;
      su['mieCoefficient'].value = 0.0005;
      su['mieDirectionalG'].value = 0.9;
      const sunPos = new THREE.Vector3().setFromSphericalCoords(1, Math.PI * 0.15, Math.PI * 0.25);
      su['sunPosition'].value.copy(sunPos);

      // 环境贴图
      const pmremGen = new THREE.PMREMGenerator(renderer);
      const envMap = pmremGen.fromScene(sky).texture;
      scene.environment = envMap;
      // 使用环境贴图作为背景，确保天空HDR可见
      

      // 光照
      scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 0.3)); // 减弱环境光
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); // 略微降低主光强
      dirLight.position.copy(sunPos).multiplyScalar(50);
      dirLight.castShadow = true;
      scene.add(dirLight);
      const rim = new THREE.DirectionalLight(0xffffff, 0.3);
      rim.position.set(-10,10,-10);
      scene.add(rim);

      // 沙底
      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(200,200),
        new THREE.MeshStandardMaterial({ color:0xDDCBA0, roughness:1 })
      );
      sand.rotation.x = -Math.PI/2;
      scene.add(sand);

      // Jelly Sea 水面
      const waterGeo = new THREE.PlaneGeometry(200,200);
      const normalTex = new THREE.TextureLoader().load(
        'https://threejs.org/examples/textures/waternormals.jpg',
        tex=> { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(16,16); }
      );
      water = new Water(waterGeo, {
        textureWidth:2048, textureHeight:2048,
        waterNormals:normalTex,
        sunDirection:sunPos.clone().normalize(),
        sunColor:0xffffff,
        waterColor:0x40E0D0, // 亮海玻璃蓝
        distortionScale:3.2,
        fog:false
      });
      water.rotation.x = -Math.PI/2;
      water.position.y = 0.1;
      water.material.transparent = true;
      water.material.opacity = 0.9;
      scene.add(water);
      // 隐藏加载遮罩，让天空和水面可见
      loadingDiv.style.display = 'none';

      // 控制
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 加载锦鲤模型
      const loader = new GLTFLoader();
      loader.load(
        'koi.glb',
        gltf=>{
          loadingDiv.style.display = 'none';
          mixer = new THREE.AnimationMixer(gltf.scene);
          gltf.animations.forEach(c=>mixer.clipAction(c).play());
          gltf.scene.scale.set(12,12,12);
          gltf.scene.position.y = 1.5;
          gltf.scene.traverse(n=>n.isMesh&&(n.castShadow=true));
          scene.add(gltf.scene);
        },
        xhr=>{
          if(xhr.lengthComputable){
            const pct=Math.round(xhr.loaded/xhr.total*100);
            loadingDiv.innerText=`加载中… ${pct}%`;
          } else{
            const kb=(xhr.loaded/1024).toFixed(1);
            loadingDiv.innerText=`加载中… ${kb} KB`;
          }
        },
        err=>loadingDiv.innerText='🚨 模型加载失败'
      );

      window.addEventListener('resize',()=>{
        camera.aspect=window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth,window.innerHeight);
      });
    }

    function animate(){
      requestAnimationFrame(animate);
      const dt=clock.getDelta();
      mixer&&mixer.update(dt);
      water&&water.material.uniforms&&(water.material.uniforms['time'].value+=dt);
      renderer.render(scene,camera);
    }
  </script>
</body>
</html>
