<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D 锦鲤池 - 极致绚丽晚霞与高亮锦鲤</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; /* Initial background, will be overridden by sky */ }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#fff;
      background:#0077be; z-index:100;
    }
    canvas { display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/",
      "examples/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'examples/controls/OrbitControls.js';
    import { GLTFLoader }  from 'examples/loaders/GLTFLoader.js';
    import { Water }       from 'examples/objects/Water.js';
    import { Sky }         from 'examples/objects/Sky.js';

    let scene, camera, renderer, clock, mixer, water, controls;
    const loadingDiv = document.getElementById('loading');

    init();
    animate();

    function init() {
      // Check if running via file protocol
      if (window.location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器打开此页面 (例如使用 VS Code Live Server)';
      }

      // Scene & Clock & Camera
      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 20000);
      camera.position.set(3, 10, 5);
      camera.lookAt(0, 0, 0);

      // Renderer
      const canvas = document.getElementById('canvas');
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, canvas: canvas });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.95; // Further increased exposure for very bright scene and fish

      // Sky Dome
      const sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);

      const skyUniforms = sky.material.uniforms;
      // Adjusted sky parameters for a truly vibrant and colorful "漫天彩霞" (sky full of colorful clouds)
      skyUniforms['turbidity'].value = 25; // High turbidity for dramatic, hazy sunset
      skyUniforms['rayleigh'].value = 0.6;  // Very low Rayleigh to let warm colors dominate intensely
      skyUniforms['mieCoefficient'].value = 0.0015; // Fine-tuned for a broad, soft sun glow
      skyUniforms['mieDirectionalG'].value = 0.98; // Very strong forward scatter for intense sun/horizon glow

      // Sun position: Just below the horizon for peak twilight colors
      const sunPosition = new THREE.Vector3();
      const phi = THREE.MathUtils.degToRad(90 + 0.8); // Sun 0.8 degrees below horizon
      const theta = THREE.MathUtils.degToRad(195);    // Azimuth for sunset direction
      sunPosition.setFromSphericalCoords(1, phi, theta);
      skyUniforms['sunPosition'].value.copy(sunPosition);

      // Environment Map & Background (Generated from the sky)
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      const envMap = pmremGenerator.fromScene(sky).texture;
      scene.environment = envMap;
      scene.background = envMap;
      pmremGenerator.dispose();

      // Lighting
      // Hemisphere light for very warm ambient sky/ground colors
      scene.add(new THREE.HemisphereLight(0xffa060, 0x604040, 1.0)); // Intense warm orange sky, warm ground, high intensity
      const dirLight = new THREE.DirectionalLight(0xff8844, 1.5); // Strong, saturated orange-red sun light
      dirLight.position.copy(sunPosition).multiplyScalar(50); // Light comes from sun's direction (even if below horizon)
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 500;
      dirLight.shadow.camera.left = -100;
      dirLight.shadow.camera.right = 100;
      dirLight.shadow.camera.top = 100;
      dirLight.shadow.camera.bottom = -100;
      scene.add(dirLight);

      // Sand Bottom
      const sandMaterial = new THREE.MeshStandardMaterial({ color: 0xA09060, roughness: 1 }); // Adjusted sand for deep evening
      const sandGeometry = new THREE.PlaneGeometry(200, 200);
      const sand = new THREE.Mesh(sandGeometry, sandMaterial);
      sand.rotation.x = -Math.PI / 2;
      sand.receiveShadow = true;
      scene.add(sand);

      // Water Surface
      const waterGeometry = new THREE.PlaneGeometry(200, 200);
      const waterNormalsTexture = new THREE.TextureLoader().load(
        'https://threejs.org/examples/textures/waternormals.jpg',
        (texture) => {
          texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
          texture.repeat.set(16, 16);
        }
      );

      water = new Water(waterGeometry, {
        textureWidth: 1024,
        textureHeight: 1024,
        waterNormals: waterNormalsTexture,
        sunDirection: sunPosition.clone().normalize(), // Use the calculated sun direction
        sunColor: dirLight.color.getHex(), // Match water sun color to directional light for consistency
        waterColor: 0x40E0D0, // Keep water turquoise/green as requested
        distortionScale: 3.7,
        fog: scene.fog !== undefined
      });
      water.rotation.x = -Math.PI / 2;
      water.position.y = 0.1;
      scene.add(water);

      // OrbitControls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 3; 
      controls.maxDistance = 100;
      controls.maxPolarAngle = Math.PI / 2 - 0.01; 
      controls.target.set(0, 1, 0);
      controls.update();

      // GLTF Loader for Koi Fish
      const loader = new GLTFLoader();
      loader.load(
        'koi.glb', // Ensure this path is correct
        (gltf) => {
          const fishModel = gltf.scene;
          fishModel.rotation.y = Math.PI;
          mixer = new THREE.AnimationMixer(fishModel);
          gltf.animations.forEach((clip) => {
            mixer.clipAction(clip).play();
          });
          fishModel.scale.set(12, 12, 12);
          fishModel.position.y = 1.5;
          fishModel.traverse((node) => {
            if (node.isMesh) {
              node.castShadow = true;
              node.receiveShadow = true; 
            }
          });
          scene.add(fishModel);
          loadingDiv.style.display = 'none';
        },
        (xhr) => {
          if (xhr.lengthComputable) {
            const percentComplete = Math.round(xhr.loaded / xhr.total * 100);
            loadingDiv.innerText = `加载锦鲤中… ${percentComplete}%`;
          } else {
            const kbLoaded = (xhr.loaded / 1024).toFixed(1);
            loadingDiv.innerText = `加载锦鲤中… ${kbLoaded} KB`;
          }
        },
        (error) => {
          console.error('An error happened during GLTF loading:', error);
          loadingDiv.innerHTML = '🚨 <span style="color:yellow;">锦鲤模型加载失败.</span><br>请确保 koi.glb 文件在正确的位置并且网络通畅。<br><small>' + error.message + '</small>';
        }
      );
      
      if (!loadingDiv.innerText.includes('锦鲤')) {
          // Fallback for hiding loading if GLTF doesn't trigger it
          // loadingDiv.style.display = 'none'; 
      }

      window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const deltaTime = clock.getDelta();

      if (mixer) {
        mixer.update(deltaTime);
      }

      if (water && water.material.uniforms['time']) {
        water.material.uniforms['time'].value += deltaTime / 2;
      }

      if (controls) {
        controls.update();
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
