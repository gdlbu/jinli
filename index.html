<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>3D 锦鲤池（黄昏晚霞 & 闪亮锦鲤）</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000000; /* 纯黑过渡到 Sky Dome */
    }
    #loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: sans-serif; font-size: 1.2em; color: #fff;
      background: #332211; z-index: 100;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/",
      "examples/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls }     from 'examples/controls/OrbitControls.js';
    import { GLTFLoader }        from 'examples/loaders/GLTFLoader.js';
    import { Water }             from 'examples/objects/Water.js';
    import { Sky }               from 'examples/objects/Sky.js';

    let scene, camera, renderer, clock, mixer, water;
    const loadingDiv = document.getElementById('loading');

    init();
    animate();

    function init() {
      if (window.location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器打开此页面';
        return;
      }

      // —— 场景 & 相机 & 时钟 —— 
      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(3, 10, 5);
      camera.lookAt(0, 0, 0);

      // —— 渲染器：关闭 tone mapping，保留原生色彩 —— 
      renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById('canvas') });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.setClearColor(0x000000, 1);

      // —— Sky Dome：高 turbidity + 低 rayleigh + 夕阳位置 —— 
      const sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);
      const su = sky.material.uniforms;
      su.turbidity.value       = 15;     // 多尘土，突出晚霞
      su.rayleigh.value        = 2;      // 减少纯蓝，增强金橙
      su.mieCoefficient.value  = 0.02;   // 增加散射
      su.mieDirectionalG.value = 0.9;
      // 太阳接近地平线
      const sunPos = new THREE.Vector3().setFromSphericalCoords(
        1,
        Math.PI * 0.48,   // φ ≈86°
        Math.PI * 0.25
      );
      su.sunPosition.value.copy(sunPos);

      // —— 环境贴图（仅 PBR 光照用） —— 
      const pmremGen = new THREE.PMREMGenerator(renderer);
      scene.environment = pmremGen.fromScene(sky).texture;

      loadingDiv.style.display = 'none';

      // —— 光照：暖色半球 & 方向光 & 弱边缘光 —— 
      const hemi = new THREE.HemisphereLight(0xFFAA66, 0x222222, 0.3);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xFFBB88, 0.8);
      sun.position.copy(sunPos).multiplyScalar(50);
      sun.castShadow = true;
      scene.add(sun);
      const rim = new THREE.DirectionalLight(0xFFFFFF, 0.15);
      rim.position.set(-10, 10, -10);
      scene.add(rim);

      // —— 地面（沙底） —— 
      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: 0xDDCBA0, roughness: 1 })
      );
      sand.rotation.x = -Math.PI/2;
      scene.add(sand);

      // —— 水面：金色倒影 + 碧绿基调 —— 
      const waterGeo = new THREE.PlaneGeometry(200, 200);
      const normalTex = new THREE.TextureLoader().load(
        'https://threejs.org/examples/textures/waternormals.jpg',
        tex => { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(16,16); }
      );
      water = new Water(waterGeo, {
        textureWidth: 2048, textureHeight: 2048,
        waterNormals: normalTex,
        sunDirection: sunPos.clone().normalize(),
        sunColor: 0xFFBB88,      // 倒影染成金橙
        waterColor: 0x00CC77,    // 深度碧绿基调
        distortionScale: 3.2,
        fog: false
      });
      water.rotation.x = -Math.PI/2;
      water.position.y = 0.1;
      water.material.transparent = true;
      water.material.opacity     = 0.85;
      scene.add(water);

      // —— 控制器 & 锦鲤模型 —— 
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const loader = new GLTFLoader();
      loader.load('koi.glb',
        gltf => {
          // 鱼模型基础设置
          gltf.scene.rotation.y = Math.PI;
          gltf.scene.scale.set(12, 12, 12);
          gltf.scene.position.y = 1.5;
          gltf.scene.traverse(n => {
            if (n.isMesh) {
              n.castShadow = true;
              // 增加自发光让鱼更亮
              n.material.emissive = new THREE.Color(0x222222);
              n.material.emissiveIntensity = 1.5;
            }
          });
          scene.add(gltf.scene);

          // 在鱼身上加一个点光源，突出鱼体
          const fishLight = new THREE.PointLight(0xFFFFFF, 1.2, 8);
          fishLight.position.set(0, 2.5, 0);
          gltf.scene.add(fishLight);

          mixer = new THREE.AnimationMixer(gltf.scene);
          gltf.animations.forEach(a => mixer.clipAction(a).play());
        },
        xhr => {
          if (xhr.lengthComputable) {
            loadingDiv.innerText = `加载中… ${Math.round(xhr.loaded/xhr.total*100)}%`;
          }
        },
        () => loadingDiv.innerText = '🚨 模型加载失败'
      );

      // —— 自适应窗口 —— 
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      mixer && mixer.update(dt);
      if (water && water.material.uniforms) {
        water.material.uniforms.time.value += dt;
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
