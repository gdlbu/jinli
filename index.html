<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D 骨骼锦鲤—ImportMap 版</title>

  <!-- Import Map：把 bare specifier 映射到 CDN URL -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/":  "https://cdn.jsdelivr.net/npm/three@0.154.0/"
    }
  }
  </script>

  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#faf8f2; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#333;
      background:#faf8f2; z-index:100;
    }
    canvas { display:block }
  </style>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>

  <script type="module">
    // 现在可以直接用 bare specifier 了
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader }  from 'three/examples/jsm/loaders/GLTFLoader.js';

    const loadingDiv = document.getElementById('loading');
    const canvas     = document.getElementById('canvas');

    let scene, camera, renderer, clock, mixer, swimAction, fleeAction;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      clock = new THREE.Clock();

      camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 10);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));
      const dl = new THREE.DirectionalLight(0xffffff, 0.8);
      dl.position.set(5,10,7);
      scene.add(dl);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200,200),
        new THREE.MeshPhongMaterial({ color:0xe0dfd5, depthWrite:false })
      );
      ground.rotation.x = -Math.PI/2;
      scene.add(ground);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const loader = new GLTFLoader();
      const url    = `${window.location.origin}/koi.glb`;
      loader.load(
        url,
        gltf => {
          loadingDiv.style.display = 'none';
          const model = gltf.scene;
          model.scale.set(2,2,2);
          scene.add(model);

          mixer = new THREE.AnimationMixer(model);
          const clips = gltf.animations;
          swimAction = mixer.clipAction(clips.find(c=>/swim/i.test(c.name)));
          fleeAction = mixer.clipAction(clips.find(c=>/flee/i.test(c.name)));
          swimAction.play();

          window.addEventListener('pointerdown', ()=>{
            fleeAction.reset().play();
            swimAction.stop();
            fleeAction.clampWhenFinished = true;
            fleeAction.loop = THREE.LoopOnce;
            mixer.addEventListener('finished', ()=>{
              fleeAction.stop();
              swimAction.reset().play();
            });
          });
        },
        xhr => {
          const pct = xhr.total ? Math.round(xhr.loaded/xhr.total*100) : 0;
          loadingDiv.innerText = `加载中… ${pct}%`;
        },
        err => {
          console.error('加载 GLTF 出错:', err);
          loadingDiv.innerText = `🚨 加载失败：${err.message||err}`;
        }
      );

      window.addEventListener('resize', ()=>{
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
