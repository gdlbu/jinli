<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D 锦鲤池（俯视初始：鱼头朝上 + 碧海蓝天 + 果冻海）</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87CEEB; }
    #loading { position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#fff;
      background:#0077be; z-index:100; }
    canvas { display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/",
      "examples/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'examples/controls/OrbitControls.js';
    import { GLTFLoader } from 'examples/loaders/GLTFLoader.js';
    import { Water } from 'examples/objects/Water.js';
    import { Sky } from 'examples/objects/Sky.js';

    let scene, camera, renderer, clock, mixer, water;
    const loadingDiv = document.getElementById('loading');
    const canvas = document.getElementById('canvas');

    init();
    animate();

    function init() {
      if (window.location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器打开页面';
        return;
      }

      // 场景 & 时钟
      scene = new THREE.Scene();
      clock = new THREE.Clock();

      // 初始俯视视角：鱼头朝上
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, 20, 0);      // 从上方俯视
      camera.lookAt(0, 0, 0);            // 指向场景中心

      // 渲染器
      renderer = new THREE.WebGLRenderer({ antialias:true, canvas });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.6;
      renderer.setClearColor(0x87CEEB);

      // Sky Dome
      const sky = new Sky();
      sky.scale.setScalar(10000);
      sky.material.side = THREE.BackSide;
      scene.add(sky);
      const su = sky.material.uniforms;
      su['turbidity'].value = 0.2;
      su['rayleigh'].value = 12;
      su['mieCoefficient'].value = 0.0005;
      su['mieDirectionalG'].value = 0.9;
      const sunPos = new THREE.Vector3().setFromSphericalCoords(1, Math.PI*0.15, Math.PI*0.25);
      su['sunPosition'].value.copy(sunPos);

      // 环境贴图 & 背景
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envMap = pmrem.fromScene(sky).texture;
      scene.environment = envMap;
      scene.background = envMap;
      loadingDiv.style.display = 'none';

      // 光照
      scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 0.3));
      const d = new THREE.DirectionalLight(0xffffff, 0.8);
      d.position.copy(sunPos).multiplyScalar(50);
      d.castShadow = true;
      scene.add(d);
      const rim = new THREE.DirectionalLight(0xffffff, 0.3);
      rim.position.set(-10,10,-10);
      scene.add(rim);

      // 沙底
      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(200,200),
        new THREE.MeshStandardMaterial({ color:0xDDCBA0, roughness:1 })
      );
      sand.rotation.x = -Math.PI/2;
      scene.add(sand);

      // 果冻海玻璃海水面
      const waterGeo = new THREE.PlaneGeometry(200,200);
      const normals = new THREE.TextureLoader().load(
        'https://threejs.org/examples/textures/waternormals.jpg',
        t=> { t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(16,16); }
      );
      water = new Water(waterGeo, {
        textureWidth:2048, textureHeight:2048,
        waterNormals: normals,
        sunDirection: sunPos.clone().normalize(),
        sunColor:0xffffff,
        waterColor:0x00FA9A,
        distortionScale:3.0,
        fog:false
      });
      water.rotation.x = -Math.PI/2;
      water.position.y = 0.1;
      water.material.transparent = true;
      water.material.opacity = 0.95;
      scene.add(water);

      // 控制器
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 加载锦鲤模型
      const loader = new GLTFLoader();
      loader.load('koi.glb', gltf => {
        mixer = new THREE.AnimationMixer(gltf.scene);
        gltf.animations.forEach(c=>mixer.clipAction(c).play());
        // 将鱼模型绕 X 轴旋转 90°，头部朝向摄像机
        // 将鱼头朝向屏幕上方（将模型局部 Z 轴正方向映射到世界 Y 轴正方向）
          gltf.scene.rotation.x = -Math.PI / 2;
        gltf.scene.scale.set(12,12,12);
        gltf.scene.position.y = 1.5;
        gltf.scene.traverse(n=>n.isMesh&&(n.castShadow=true));
        scene.add(gltf.scene);
      }, xhr=>{
        if(xhr.lengthComputable){
          loadingDiv.innerText = `加载中… ${Math.round(xhr.loaded/xhr.total*100)}%`;
        } else {
          loadingDiv.innerText = `加载中… ${(xhr.loaded/1024).toFixed(1)} KB`;
        }
      }, err=> loadingDiv.innerText='🚨 模型加载失败');

      window.addEventListener('resize', ()=>{
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate(){
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      mixer&&mixer.update(dt);
      water&&water.material.uniforms&&(water.material.uniforms['time'].value+=dt);
      renderer.render(scene,camera);
    }
  </script>
</body>
</html>
