<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D 锦鲤池（碧蓝天空 + 翠绿湖水 + 真实波纹）</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#333;
      background:#87CEEB; z-index:100;
    }
    canvas { display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/",
      "examples/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'examples/controls/OrbitControls.js';
    import { GLTFLoader }  from 'examples/loaders/GLTFLoader.js';
    import { Water }       from 'examples/objects/Water.js';
    import { Sky }         from 'examples/objects/Sky.js';

    let scene, camera, renderer, clock, mixer, water;
    const loadingDiv = document.getElementById('loading');
    const canvas = document.getElementById('canvas');

    init();
    animate();

    function init() {
      if (window.location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器（如 python -m http.server）打开此页面';
        return;
      }

      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 20);

      renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      // Sky: 强化蓝色
      const sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);
      const uniforms = sky.material.uniforms;
      uniforms['turbidity'].value = 1;
      uniforms['rayleigh'].value = 4;
      uniforms['mieCoefficient'].value = 0.002;
      uniforms['mieDirectionalG'].value = 0.8;
      const sun = new THREE.Vector3().setFromSphericalCoords(1, Math.PI * 0.4, Math.PI * 0.25);
      uniforms['sunPosition'].value.copy(sun);

      // 环境贴图 & 背景
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      const envMap = pmremGenerator.fromScene(sky).texture;
      scene.environment = envMap;
      scene.background = envMap;

      // Lights
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.copy(sun).multiplyScalar(50);
      dirLight.castShadow = true;
      scene.add(dirLight);
      // 侧光
      const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
      rimLight.position.set(-10, 10, -10);
      scene.add(rimLight);

      // Ground & Sand
      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(200,200),
        new THREE.MeshStandardMaterial({ color:0xDDCBA0, roughness:1 })
      );
      sand.rotation.x = -Math.PI/2;
      sand.position.y = 0;
      scene.add(sand);

      // Water: 翠绿 + 真实波纹
      const waterGeo = new THREE.PlaneGeometry(200,200);
      const waterNormals = new THREE.TextureLoader().load(
        'https://threejs.org/examples/textures/waternormals.jpg',
        tex => { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(8,8); },
        undefined,
        err => console.warn('水面法线加载失败', err)
      );
      water = new Water(waterGeo, {
        textureWidth: 512,
        textureHeight: 512,
        waterNormals,
        sunDirection: sun.clone().normalize(),
        sunColor: 0xffffff,
        waterColor: 0x2E8B57,
        distortionScale: 2.5,
        fog: false
      });
      water.rotation.x = -Math.PI/2;
      water.position.y = 0.1;
      water.material.transparent = true;
      water.material.opacity = 0.85;
      scene.add(water);

      // Controls
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // Load Kois
      const loader = new GLTFLoader();
      loader.load(
        'koi.glb',
        gltf => {
          loadingDiv.style.display = 'none';
          mixer = new THREE.AnimationMixer(gltf.scene);
          gltf.animations.forEach(c => mixer.clipAction(c).play());
          gltf.scene.scale.set(12,12,12);
          gltf.scene.position.y = 1.5;
          gltf.scene.traverse(n => { if (n.isMesh) n.castShadow = true; });
          scene.add(gltf.scene);
        },
        xhr => {
          const pct = xhr.total ? Math.round(xhr.loaded/xhr.total*100) : Math.round(xhr.loaded/1000) + 'KB';
          loadingDiv.innerText = `加载中… ${pct}`;
        },
        err => {
          console.error('加载失败：', err);
          loadingDiv.innerText = '🚨 模型加载失败';
        }
      );

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      if (water && water.material.uniforms) water.material.uniforms['time'].value += dt;
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
