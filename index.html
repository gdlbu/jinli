<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D 锦鲤池 · 深水效果</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87CEEB; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#fff;
      background:#0077be; z-index:100;
    }
    canvas { display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/",
      "examples/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'examples/controls/OrbitControls.js';
    import { GLTFLoader }  from 'examples/loaders/GLTFLoader.js';
    import { Sky }         from 'examples/objects/Sky.js';

    let scene, camera, renderer, clock, mixer;
    const loadingDiv = document.getElementById('loading');

    init();
    animate();

    function init() {
      if (window.location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器打开此页面';
        return;
      }

      // 场景 & 时钟 & 相机
      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(3, 10, 5);
      camera.lookAt(0, 0, 0);

      // 渲染器
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, canvas: document.getElementById('canvas') });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.62;
      renderer.setClearColor(0x87ceeb, 1);

      // Sky Dome
      const sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);
      const su = sky.material.uniforms;
      su.turbidity.value = 2.0;
      su.rayleigh.value = 6.0;
      su.mieCoefficient.value = 0.0015;
      su.mieDirectionalG.value = 0.8;
      const sunPos = new THREE.Vector3().setFromSphericalCoords(1, Math.PI * 0.31, Math.PI * 0.22);
      su.sunPosition.value.copy(sunPos);

      // 环境贴图 & 背景
      const pmremGen = new THREE.PMREMGenerator(renderer);
      const envMap = pmremGen.fromScene(sky).texture;
      scene.environment = envMap;
      scene.background = sky;

      loadingDiv.style.display = 'none';

      // 光照
      scene.add(new THREE.HemisphereLight(0xffffff, 0x8de3bf, 0.50));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
      dirLight.position.copy(sunPos).multiplyScalar(50);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // 深色沙底
      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: 0xb6d6c6, roughness: 0.5 })
      );
      sand.rotation.x = -Math.PI/2;
      scene.add(sand);

      // 深蓝绿色水面
      const waterPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshPhysicalMaterial({
          color: 0x14b2a4,      // 更深蓝绿
          transparent: true,
          opacity: 0.35,        // 更不透明
          roughness: 0.35,
          metalness: 0.1,
          reflectivity: 0.7,
          clearcoat: 1.0,
          clearcoatRoughness: 0.2
        })
      );
      waterPlane.rotation.x = -Math.PI / 2;
      waterPlane.position.y = 0.1;
      scene.add(waterPlane);

      // 控制器
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 加载锦鲤模型 & 初始朝向调整
      const loader = new GLTFLoader();
      loader.load(
        'koi.glb',
        gltf => {
          gltf.scene.rotation.y = Math.PI;
          mixer = new THREE.AnimationMixer(gltf.scene);
          gltf.animations.forEach(c => mixer.clipAction(c).play());
          gltf.scene.scale.set(12, 12, 12);
          gltf.scene.position.y = waterPlane.position.y - 0.08;
          gltf.scene.traverse(n => n.isMesh && (n.castShadow = true));
          scene.add(gltf.scene);
          loadingDiv.style.display = 'none';
        },
        xhr => {
          if (xhr.lengthComputable) {
            const pct = Math.round(xhr.loaded / xhr.total * 100);
            loadingDiv.innerText = `加载中… ${pct}%`;
          } else {
            const kb = (xhr.loaded / 1024).toFixed(1);
            loadingDiv.innerText = `加载中… ${kb} KB`;
          }
        },
        err => loadingDiv.innerText = '🚨 模型加载失败'
      );

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      mixer && mixer.update(dt);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
