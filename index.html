<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D 锦鲤池 · 深蓝绿色动态水面+水下可见</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87CEEB; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#fff;
      background:#0077be; z-index:100;
    }
    canvas { display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/",
      "examples/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'examples/controls/OrbitControls.js';
    import { GLTFLoader }    from 'examples/loaders/GLTFLoader.js';
    import { Sky }           from 'examples/objects/Sky.js';

    let scene, camera, renderer, clock, mixer;
    let waterNormalMap;
    const loadingDiv = document.getElementById('loading');

    init();
    animate();

    function init() {
      if (window.location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器打开此页面';
        return;
      }

      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(3, 10, 5);
      camera.lookAt(0, 1, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, canvas: document.getElementById('canvas') });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.62;
      renderer.setClearColor(0x87ceeb, 1);

      // Sky Dome
      const sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);
      const su = sky.material.uniforms;
      su.turbidity.value = 2.0;
      su.rayleigh.value = 6.0;
      su.mieCoefficient.value = 0.0015;
      su.mieDirectionalG.value = 0.8;
      const sunPos = new THREE.Vector3().setFromSphericalCoords(1, Math.PI * 0.31, Math.PI * 0.22);
      su.sunPosition.value.copy(sunPos);

      const pmremGen = new THREE.PMREMGenerator(renderer);
      const envMap = pmremGen.fromScene(sky).texture;
      scene.environment = envMap;
      scene.background = sky;

      loadingDiv.style.display = 'none';

      scene.add(new THREE.HemisphereLight(0xffffff, 0x8de3bf, 0.50));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
      dirLight.position.copy(sunPos).multiplyScalar(50);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // 沙底
      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: 0x89a59e, roughness: 0.53 })
      );
      sand.rotation.x = -Math.PI/2;
      sand.position.y = 0;
      scene.add(sand);

      // ==== 深蓝绿色动态水面（可见水下，含水波）====
      waterNormalMap = new THREE.TextureLoader().load('https://threejs.org/examples/textures/waternormals.jpg');
      waterNormalMap.wrapS = waterNormalMap.wrapT = THREE.RepeatWrapping;

      const waterPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200, 256, 256),
        new THREE.MeshPhysicalMaterial({
          color: 0x045762, // 更深蓝绿色
          transparent: true,
          opacity: 0.35,   // 深水感，若太深可调高至0.33
          roughness: 0.36,
          metalness: 0.08,
          reflectivity: 0.8,
          clearcoat: 1.0,
          clearcoatRoughness: 0.2,
          normalMap: waterNormalMap,
          normalScale: new THREE.Vector2(0.6, 0.7)
        })
      );
      waterPlane.rotation.x = -Math.PI / 2;
      waterPlane.position.y = 2.0;
      scene.add(waterPlane);

      // 控制器
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 锦鲤
      const loader = new GLTFLoader();
      loader.load(
        'koi.glb',
        gltf => {
          gltf.scene.rotation.y = Math.PI;
          mixer = new THREE.AnimationMixer(gltf.scene);
          gltf.animations.forEach(c => mixer.clipAction(c).play());
          gltf.scene.scale.set(12, 12, 12);
          gltf.scene.position.y = waterPlane.position.y+0.02; // 水面2.0，鱼在水下
          gltf.scene.traverse(n => n.isMesh && (n.castShadow = true));
          scene.add(gltf.scene);
          loadingDiv.style.display = 'none';
        },
        xhr => {
          if (xhr.lengthComputable) {
            const pct = Math.round(xhr.loaded / xhr.total * 100);
            loadingDiv.innerText = `加载中… ${pct}%`;
          } else {
            const kb = (xhr.loaded / 1024).toFixed(1);
            loadingDiv.innerText = `加载中… ${kb} KB`;
          }
        },
        err => loadingDiv.innerText = '🚨 模型加载失败'
      );

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      mixer && mixer.update(dt);

      // 水面动态法线波动
      if (waterNormalMap) {
        let t = performance.now() * 0.00004;
        waterNormalMap.offset.x = t;
        waterNormalMap.offset.y = t * 0.5;
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
