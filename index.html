<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D 锦鲤池 · Water.js真实动态水面（鱼背略高出水面）</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87CEEB; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#fff;
      background:#0077be; z-index:100;
    }
    canvas { display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/",
      "examples/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'examples/controls/OrbitControls.js';
    import { GLTFLoader }    from 'examples/loaders/GLTFLoader.js';
    import { Sky }           from 'examples/objects/Sky.js';
    import { Water }         from 'examples/objects/Water.js';

    let scene, camera, renderer, clock, mixer;
    const loadingDiv = document.getElementById('loading');
    let water; // 供 animate 动态更新

    init();
    animate();

    function init() {
      if (window.location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器打开此页面';
        return;
      }

      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(3, 10, 5);
      camera.lookAt(0, 2, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, canvas: document.getElementById('canvas') });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.62;
      renderer.setClearColor(0x87ceeb, 1);

      // Sky Dome
      const sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);
      const su = sky.material.uniforms;
      su.turbidity.value = 2.0;
      su.rayleigh.value = 6.0;
      su.mieCoefficient.value = 0.0015;
      su.mieDirectionalG.value = 0.8;
      const sunPos = new THREE.Vector3().setFromSphericalCoords(1, Math.PI * 0.31, Math.PI * 0.22);
      su.sunPosition.value.copy(sunPos);

      // 环境贴图 & 背景
      const pmremGen = new THREE.PMREMGenerator(renderer);
      const envMap = pmremGen.fromScene(sky).texture;
      scene.environment = envMap;
      scene.background = sky;

      loadingDiv.style.display = 'none';

      scene.add(new THREE.HemisphereLight(0xffffff, 0x8de3bf, 0.55));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.copy(sunPos).multiplyScalar(50);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // 沙底
      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: 0x6d857c, roughness: 0.54 })
      );
      sand.rotation.x = -Math.PI/2;
      sand.position.y = 0;
      scene.add(sand);

      // ==== 真实动态水面（Water.js）====
      const waterNormals = new THREE.TextureLoader().load(
        'https://threejs.org/examples/textures/waternormals.jpg',
        tex => { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(16, 16); }
      );
      water = new Water(
        new THREE.PlaneGeometry(200, 200),
        {
          textureWidth: 2048,
          textureHeight: 2048,
          waterNormals,
          sunDirection: sunPos.clone().normalize(),
          sunColor: 0xffffff,
          waterColor: 0x045762,      // 很深的蓝绿色
          distortionScale: 1.15,
          fog: false
        }
      );
      water.rotation.x = -Math.PI / 2;
      water.position.y = 2.0;
      water.material.transparent = true;
      water.material.opacity = 0.83;
      water.material.side = THREE.FrontSide;
      scene.add(water);

      // 控制器
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 锦鲤
      const loader = new GLTFLoader();
      loader.load(
        'koi.glb',
        gltf => {
          gltf.scene.rotation.y = Math.PI;
          mixer = new THREE.AnimationMixer(gltf.scene);
          gltf.animations.forEach(c => mixer.clipAction(c).play());
          gltf.scene.scale.set(12, 12, 12);

          // 让鱼背略高于水面
          gltf.scene.position.y = water.position.y + 0.10; // 比水面高0.10，鱼背可见，鱼体大部分在水下
          gltf.scene.traverse(n => n.isMesh && (n.castShadow = true));
          scene.add(gltf.scene);
          loadingDiv.style.display = 'none';
        },
        xhr => {
          if (xhr.lengthComputable) {
            const pct = Math.round(xhr.loaded / xhr.total * 100);
            loadingDiv.innerText = `加载中… ${pct}%`;
          } else {
            const kb = (xhr.loaded / 1024).toFixed(1);
            loadingDiv.innerText = `加载中… ${kb} KB`;
          }
        },
        err => loadingDiv.innerText = '🚨 模型加载失败'
      );

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      mixer && mixer.update(dt);

      // Water.js 波动动画
      if (water && water.material.uniforms && water.material.uniforms.time) {
        water.material.uniforms.time.value += dt;
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
