<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>锦鲤 jin.li</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#82e5dc !important; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#fff;
      background:transparent !important; 
      z-index:100;
      opacity: 1;
      transition: opacity 0.8s cubic-bezier(.45,0,.55,1);
      pointer-events: auto;
      text-shadow: 0 2px 8px #206668, 0 1px 2px #43b9b6;
    }
    #loading.hide { opacity:0; pointer-events:none; }
    canvas { background:transparent !important; display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/three/three.module.js",
      "three/": "/three/",
      "examples/": "/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script>
  window.addEventListener('DOMContentLoaded', () => {
    // 1. 创建并插入动画背景canvas
    const bgCanvas = document.createElement('canvas');
    bgCanvas.width = window.innerWidth * 2;
    bgCanvas.height = window.innerHeight * 2;
    bgCanvas.style.width = '100vw';
    bgCanvas.style.height = '100vh';
    bgCanvas.style.position = 'fixed';
    bgCanvas.style.top = 0;
    bgCanvas.style.left = 0;
    bgCanvas.style.zIndex = -1;
    document.body.insertBefore(bgCanvas, document.body.firstChild);

    const ctx = bgCanvas.getContext('2d');
    let W = bgCanvas.width, H = bgCanvas.height;

    // 【2.1】插入canvas后立即同步填充一帧主色
    const grad = ctx.createRadialGradient(
      W/2, H*0.52, W*0.03,
      W/2, H/2, W/1.01
    );
    grad.addColorStop(0.00, '#82e5dc');
    grad.addColorStop(0.20, '#63d1c9');
    grad.addColorStop(0.46, '#51bfc1');
    grad.addColorStop(0.85, '#3baab2');
    grad.addColorStop(1.00, '#229c9b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 2.2 动态波光参数
    let spots = Array.from({length: 15}).map((_, i) => ({
      x: Math.random() * W,
      y: Math.random() * H * 0.8 + H * 0.1,
      rx: 50 + Math.random() * 70,
      ry: 38 + Math.random() * 48,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 0.8,
      color: Math.random() > 0.5 ? '#c9fff4' : '#d3fff8',
      alpha: 0.04 + Math.random() * 0.04
    }));

    // 2.3 动画
    function draw(t) {
      // 动态渐变与波光
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = grad; // 渐变色不变
      ctx.fillRect(0, 0, W, H);
      spots.forEach((s, i) => {
        ctx.save();
        ctx.globalAlpha = s.alpha * (0.85 + 0.15 * Math.sin(t * 0.001 * s.speed + s.phase));
        ctx.filter = `blur(${15 + Math.sin(t * 0.001 * (s.speed + i)) * 5}px)`;
        ctx.beginPath();
        const yFloat = s.y + Math.sin(t * 0.0004 + s.phase + i) * 10;
        const rx = s.rx + Math.sin(t * 0.0006 + i) * 3;
        const ry = s.ry + Math.cos(t * 0.0006 + i) * 2.5;
        ctx.ellipse(s.x, yFloat, rx, ry, s.phase + Math.sin(t * 0.0003 + i), 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.fill();
        ctx.restore();
      });
      ctx.globalAlpha = 1;
      ctx.filter = 'none';
      requestAnimationFrame(draw);
    }
    draw(0);

    // 3. 响应窗口缩放
    window.addEventListener('resize', () => {
      bgCanvas.width = window.innerWidth * 2;
      bgCanvas.height = window.innerHeight * 2;
      W = bgCanvas.width; H = bgCanvas.height;
      // 立刻重绘静态主色，避免resize时背景一闪
      const grad = ctx.createRadialGradient(
        W/2, H*0.52, W*0.03,
        W/2, H/2, W/1.01
      );
      grad.addColorStop(0.00, '#82e5dc');
      grad.addColorStop(0.20, '#63d1c9');
      grad.addColorStop(0.46, '#51bfc1');
      grad.addColorStop(0.85, '#3baab2');
      grad.addColorStop(1.00, '#229c9b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      spots = Array.from({length: 15}).map((_, i) => ({
        x: Math.random() * W,
        y: Math.random() * H * 0.8 + H * 0.1,
        rx: 50 + Math.random() * 70,
        ry: 38 + Math.random() * 48,
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 0.8,
        color: Math.random() > 0.5 ? '#c9fff4' : '#d3fff8',
        alpha: 0.04 + Math.random() * 0.04
      }));
    });

    // loading 遮罩透明
    const loadingDiv = document.getElementById('loading');
    if (loadingDiv) loadingDiv.style.background = 'transparent';
  });
  </script>
  <!-- three.js 场景代码不变，按之前方式，透明渲染 -->
  <script type="module">
    /* ...three.js 代码略，完全照你的方式即可（alpha:true，不要setClearColor！）... */
  </script>
</body>
</html>
