<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 锦鲤池（终极版）</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#faf8f2; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#333;
      background:#faf8f2; z-index:100;
    }
    canvas { display:block; }
  </style>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>

  <script type="module">
    // **绝对 URL** 引入 Three.js ESModule 版
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader }  from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/loaders/GLTFLoader.js';

    // 全局变量
    let scene, camera, renderer, clock, mixer, swimAction, fleeAction;
    const loadingDiv = document.getElementById('loading');
    const canvas = document.getElementById('canvas');

    // 初始化
    init();
    animate();

    function init() {
      // 场景和时钟
      scene = new THREE.Scene();
      clock = new THREE.Clock();

      // 相机
      camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 10);

      // 渲染器
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      // 灯光
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // 地面（可删除）
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshPhongMaterial({ color: 0xe0dfd5, depthWrite: false })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // 控制器（调试用）
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 加载 GLTF 模型
      const loader = new GLTFLoader();
      // 使用根路径 + 文件名
      const modelUrl = `${window.location.origin}/koi.glb`;
      console.log('加载模型 URL:', modelUrl);
      loader.load(
        modelUrl,
        gltf => {
          console.log('模型加载成功', gltf);
          loadingDiv.style.display = 'none';
          const model = gltf.scene;
          model.scale.set(2, 2, 2);
          scene.add(model);

          // 骨骼动画
          mixer = new THREE.AnimationMixer(model);
          const clips = gltf.animations;
          swimAction = mixer.clipAction(clips.find(c => /swim/i.test(c.name)));
          fleeAction = mixer.clipAction(clips.find(c => /flee/i.test(c.name)));
          swimAction.play();

          // 点击触发逃跑
          window.addEventListener('pointerdown', () => {
            fleeAction.reset().play();
            swimAction.stop();
            fleeAction.clampWhenFinished = true;
            fleeAction.loop = THREE.LoopOnce;
            mixer.addEventListener('finished', () => {
              fleeAction.stop();
              swimAction.reset().play();
            });
          });
        },
        xhr => {
          const percent = xhr.total ? Math.round(xhr.loaded / xhr.total * 100) : 0;
          loadingDiv.innerText = `加载中… ${percent}%`;
          console.log(`加载进度：${percent}%`);
        },
        error => {
          console.error('模型加载出错：', error);
          loadingDiv.innerText = `🚨 加载失败：${error.message || error}`;
        }
      );

      // 窗口大小改变
      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    }

    // 渲染循环
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
