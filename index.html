<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>极致真实·3D 锦鲤池（无 HDR 版）</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87CEEB; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#333;
      background:#87CEEB; z-index:100;
    }
    canvas { display:block }
  </style>
  <!-- Import Map：映射 bare specifier -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载场景…</div>
  <canvas id="canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader }   from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { Water }        from 'three/examples/jsm/objects/Water.js';
    import { Sky }          from 'three/examples/jsm/objects/Sky.js';

    let scene, camera, renderer, clock, mixer, water;
    const loading = document.getElementById('loading');
    const canvas  = document.getElementById('canvas');

    init();
    animate();

    function init() {
      // —— 场景 & 相机 & 时钟 —— 
      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 2000);
      camera.position.set(0, 8, 20);

      // —— 渲染器 —— 
      renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
      renderer.setClearColor(0x87CEEB);

      // —— 天空效果 —— 
      const sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);
      const sun = new THREE.Vector3();
      sun.setFromSphericalCoords(1, Math.PI*0.4, Math.PI*0.25);
      sky.material.uniforms['sunPosition'].value.copy(sun);

      // —— 光照 —— 
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.copy(sun).multiplyScalar(50);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.set(2048,2048);
      scene.add(dirLight);

      // —— 底部沙地，用来接阴影 —— 
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200,200),
        new THREE.ShadowMaterial({ opacity: 0.2 })
      );
      ground.rotation.x = -Math.PI/2;
      ground.position.y = -0.1;
      ground.receiveShadow = true;
      scene.add(ground);

      // —— 水面 —— 
      const waterGeo = new THREE.PlaneGeometry(200,200);
      const waterNormals = new THREE.TextureLoader().load(
        'https://threejs.org/examples/textures/waternormals.jpg',
        tex => tex.wrapS = tex.wrapT = THREE.RepeatWrapping
      );
      water = new Water(waterGeo, {
        textureWidth: 512, textureHeight: 512,
        waterNormals,
        sunDirection: sun.clone().normalize(),
        sunColor: 0xffffff,
        waterColor: 0x1EB980,
        distortionScale: 1.0,
        fog: false
      });
      water.rotation.x = -Math.PI/2;
      water.position.y = 0;
      scene.add(water);

      // —— 轨道控制（可删） —— 
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.maxPolarAngle = Math.PI/2 - 0.1;

      // —— 加载锦鲤模型 —— 
      const loader = new GLTFLoader();
      loader.load(
        `${window.location.origin}/koi.glb`,
        gltf => {
          loading.style.display = 'none';
          const model = gltf.scene;
          model.scale.set(12,12,12);
          model.position.y = 1.5;
          model.traverse(n=> n.isMesh && (n.castShadow=true));
          scene.add(model);

          // —— 播放所有自带动画 —— 
          mixer = new THREE.AnimationMixer(model);
          console.log('动画片段：', gltf.animations.map(a=>a.name));
          gltf.animations.forEach(clip => mixer.clipAction(clip).play());

          // —— 点击逃跑 —— 
          window.addEventListener('pointerdown', () => {
            const fleeClip = gltf.animations.find(c=>/flee/i.test(c.name));
            if (fleeClip) {
              const action = mixer.clipAction(fleeClip);
              action.reset().play();
              action.clampWhenFinished = true;
              action.loop = THREE.LoopOnce;
            }
          });
        },
        xhr => {
          const pct = xhr.total ? Math.round(xhr.loaded/xhr.total*100) : 0;
          loading.innerText = `加载锦鲤… ${pct}%`;
        },
        err => {
          console.error('锦鲤加载失败', err);
          loading.innerText = '⚠️ 锦鲤加载失败';
        }
      );

      window.addEventListener('resize', onResize);
    }

    function onResize() {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      water.material.uniforms['time'].value += dt;
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
