<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D 锦鲤池（碧海蓝天 + 果冻海玻璃海）</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87CEEB; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#fff;
      background:#0077be; z-index:100;
    }
    canvas { display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/",
      "examples/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'examples/controls/OrbitControls.js';
    import { GLTFLoader }  from 'examples/loaders/GLTFLoader.js';
    import { Water }       from 'examples/objects/Water.js';
    import { Sky }         from 'examples/objects/Sky.js';

    let scene, camera, renderer, clock, mixer, water;
    const loadingDiv = document.getElementById('loading');
    const canvas     = document.getElementById('canvas');

    init();
    animate();

    function init() {
      if (window.location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器（如 python -m http.server）打开此页面';
        return;
      }

      // 场景与相机
      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      // 初始俯视：摄像机置于鱼身正上方
      camera.position.set(0, 20, 0); // Y 轴正方向上方
      camera.up.set(0, 0, 1);         // 设定世界 Z 轴为屏幕上方，使鱼头（正 Z 方向）指向上方
      camera.lookAt(0, 0, 0);(0, 0, 0);
      // 初始旋转视图，使鱼头指向屏幕上方
      //  // 移除 roll 旋转，改用 camera.up 定义初始方向

       // 初始时旋转视图，使鱼头朝屏幕上方


      renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.6; // 降低曝光
      //renderer.setClearColor(0x87CEEB); // Removed to use HDR sky background


      // Sky Dome
      const sky = new Sky();
      sky.scale.setScalar(10000);
      sky.material.side = THREE.BackSide; // 渲染内侧
      scene.add(sky);
      const su = sky.material.uniforms;
      su['turbidity'].value = 0.2;
      su['rayleigh'].value = 12;
      su['mieCoefficient'].value = 0.0005;
      su['mieDirectionalG'].value = 0.9;
      const sunP = new THREE.Vector3().setFromSphericalCoords(1, Math.PI * 0.15, Math.PI * 0.25);
      su['sunPosition'].value.copy(sunP);

      // 环境贴图
      const pmremGen = new THREE.PMREMGenerator(renderer);
      const envMap = pmremGen.fromScene(sky).texture;
      scene.environment = envMap;
      // 使用环境贴图作为背景显示深邃天空
      scene.background = envMap;
      // 一旦背景渲染完成，移除加载遮罩
      loadingDiv.style.display = 'none';

      // 光照
      scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 0.3));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.copy(sunP).multiplyScalar(50);
      dirLight.castShadow = true;
      scene.add(dirLight);
      const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
      rimLight.position.set(-10, 10, -10);
      scene.add(rimLight);

      // 沙底
      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: 0xDDCBA0, roughness: 1 })
      );
      sand.rotation.x = -Math.PI/2;
      scene.add(sand);

      // 果冻海水面
      const waterGeo = new THREE.PlaneGeometry(200, 200);
      const waterNormals = new THREE.TextureLoader().load(
        'https://threejs.org/examples/textures/waternormals.jpg',
        tex => { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(16, 16); }
      );
      water = new Water(waterGeo, {
        textureWidth: 2048,
        textureHeight: 2048,
        waterNormals,
        sunDirection: sunP.clone().normalize(),
        sunColor: 0xffffff,
        waterColor: 0x00FA9A, // 浅春绿色
        distortionScale: 3.0,
        fog: false
      });
      water.rotation.x = -Math.PI/2;
      water.position.y = 0.1;
      water.material.transparent = true;
      water.material.opacity = 0.95;
      scene.add(water);

      // 控制器
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 模型加载与进度
      const loader = new GLTFLoader();
      loader.load(
        'koi.glb',
        gltf => {
          loadingDiv.style.display = 'none';
          mixer = new THREE.AnimationMixer(gltf.scene);
          gltf.animations.forEach(c => mixer.clipAction(c).play());
          gltf.scene.scale.set(12, 12, 12);
          gltf.scene.position.y = 1.5;
                    // 不对鱼模型进行旋转，保留原始方向
                    // 初始将鱼模型绕 X 轴旋转 90°，使鱼头朝向屏幕上方
          gltf.scene.rotation.x = Math.PI / 2;
                    // 初始旋转：将鱼头指向屏幕上方
          gltf.scene.rotation.x = Math.PI / 2;
          scene.add(gltf.scene);
        },
        xhr => {
          if (xhr.lengthComputable) {
            const pct = Math.round(xhr.loaded / xhr.total * 100);
            loadingDiv.innerText = `加载中… ${pct}%`;
          } else {
            const kb = (xhr.loaded / 1024).toFixed(1);
            loadingDiv.innerText = `加载中… ${kb} KB`;
          }
        },
        err => loadingDiv.innerText = '🚨 模型加载失败'
      );

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      mixer && mixer.update(dt);
      water && water.material.uniforms && (water.material.uniforms['time'].value += dt);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
