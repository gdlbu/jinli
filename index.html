<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>3D 骨骼动画锦鲤池</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    body { background: #faf8f2; overflow:hidden; }
    canvas { display:block }
    #loading {
      position: fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      background: #faf8f2; font-family: sans-serif; font-size: 1.2em;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/controls/OrbitControls.js';

    let scene, camera, renderer, clock, mixer, swimAction, fleeAction;
    const loadingDiv = document.getElementById('loading');

    init();
    animate();

    function init() {
      // 场景与时钟
      scene = new THREE.Scene();
      clock = new THREE.Clock();

      // 相机
      camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 10);

      // 渲染器
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      // 灯光
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5,10,7);
      scene.add(dirLight);

      // 地面（可选）
      const groundMat = new THREE.MeshPhongMaterial({ color: 0xe0dfd5, depthWrite: false });
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200), groundMat);
      ground.rotation.x = -Math.PI/2;
      scene.add(ground);

      // 控制器（调试用）
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.maxPolarAngle = Math.PI/2 - 0.1;

      // GLTF 加载
      const loader = new GLTFLoader();
      // 构造绝对 URL，避免相对路径问题
      const glbUrl = `${window.location.origin}/koi.glb`;
      loader.load(
        glbUrl,
        gltf => {
          // 模型加载成功
          const model = gltf.scene;
          model.scale.set(2,2,2);
          scene.add(model);

          // 动画
          mixer = new THREE.AnimationMixer(model);
          const clips = gltf.animations;
          swimAction = mixer.clipAction(clips.find(c => /swim/i.test(c.name)));
          fleeAction = mixer.clipAction(clips.find(c => /flee/i.test(c.name)));
          swimAction.play();

          // 隐藏 loading
          loadingDiv.style.display = 'none';

          // 点击触发逃跑
          window.addEventListener('pointerdown', () => {
            fleeAction.reset().play();
            swimAction.stop();
            fleeAction.clampWhenFinished = true;
            fleeAction.loop = THREE.LoopOnce;
            mixer.addEventListener('finished', () => {
              fleeAction.stop();
              swimAction.reset().play();
            });
          });
        },
        xhr => {
          // 进度更新
          const pct = xhr.total ? (xhr.loaded / xhr.total * 100).toFixed(0) : '…';
          loadingDiv.innerText = `加载中… ${pct}%`;
        },
        err => {
          // 错误回调
          console.error('GLTF 加载错误：', err);
          loadingDiv.innerText = '🚨 模型加载失败，请检查 koi.glb 是否部署并且可访问';
        }
      );

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
