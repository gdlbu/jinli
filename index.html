<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D 锦鲤池（增强版：墨绿色清澈湖水）</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87CEEB; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#333;
      background:#87CEEB; z-index:100;
    }
    canvas { display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/",
      "examples/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'examples/controls/OrbitControls.js';
    import { GLTFLoader }  from 'examples/loaders/GLTFLoader.js';
    import { Water }        from 'examples/objects/Water.js';
    import { Sky }          from 'examples/objects/Sky.js';

    let scene, camera, renderer, clock, mixer, water;
    const loadingDiv = document.getElementById('loading');
    const canvas     = document.getElementById('canvas');

    init();
    animate();

    function init() {
      // 场景 & 时钟 & 相机
      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 20);

      // 渲染器 + 阴影 + 色彩空间 + HDR
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
      renderer.outputEncoding     = THREE.sRGBEncoding;
      renderer.toneMapping        = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.setClearColor(0x87CEEB);

      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();

      // 天空 + 环境贴图
      const sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);
      const sun = new THREE.Vector3();
      sun.setFromSphericalCoords(1, Math.PI * 0.4, Math.PI * 0.25);
      sky.material.uniforms['sunPosition'].value.copy(sun);
      const envMap = pmremGenerator.fromScene(sky).texture;
      scene.environment = envMap;

      // 全局光照
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.copy(sun).multiplyScalar(50);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.set(2048, 2048);
      scene.add(dirLight);
      const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
      rimLight.position.set(-10, 10, -10);
      scene.add(rimLight);

      // 底部沙地
      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(200,200),
        new THREE.MeshStandardMaterial({
          color: 0xDDCBA0,
          roughness: 1.0
        })
      );
      sand.rotation.x = -Math.PI/2;
      sand.position.y = 0;
      scene.add(sand);

      // 墨绿色清澈水面
      const waterGeo = new THREE.PlaneGeometry(200, 200);
      const waterNormals = new THREE.TextureLoader().load(
        'https://threejs.org/examples/textures/waternormals.jpg', tex => tex.repeat.set(4,4)
      );
      water = new Water(waterGeo, {
        textureWidth: 512,
        textureHeight: 512,
        waterNormals,
        sunDirection: sun.clone().normalize(),
        sunColor: 0xffffff,
        waterColor: 0x013220,  // 墨绿色
        distortionScale: 1.0,
        fog: scene.fog !== undefined
      });
      water.rotation.x = -Math.PI/2;
      water.position.y = 0.2;  // 略高于沙面，以区分水面与沙底
      scene.add(water);

      // 使水面半透明以呈现清澈效果
      water.material.transparent = true;
      water.material.opacity = 0.7;

      // 控制器
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.maxPolarAngle = Math.PI/2 - 0.1;

      // 加载锦鲤模型 (请确保 koi.glb 与此 HTML 同目录)
      const loader = new GLTFLoader();
      loader.load(
        'koi.glb',
        gltf => {
          loadingDiv.style.display = 'none';
          const model = gltf.scene;
          model.scale.set(12,12,12);
          model.position.y = 1.5;
          model.traverse(n => {
            if (n.isMesh && n.material.isMeshStandardMaterial) {
              n.castShadow = true;
              n.material.metalness = 0.2;
              n.material.roughness = 0.1;
              n.material.envMapIntensity = 1.5;
              n.material.needsUpdate = true;
            }
          });
          scene.add(model);

          mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach(clip => mixer.clipAction(clip).play());

          window.addEventListener('pointerdown', () => {
            const flee = gltf.animations.find(c => /flee/i.test(c.name));
            if (flee) {
              const action = mixer.clipAction(flee);
              action.reset().play();
              action.clampWhenFinished = true;
              action.loop = THREE.LoopOnce;
            }
          });
        },
        xhr => {
          const pct = xhr.total ? Math.round(xhr.loaded/xhr.total*100) : 0;
          loadingDiv.innerText = `加载中… ${pct}%`;
        },
        err => {
          console.error('加载错误：', err);
          loadingDiv.innerText = `🚨 加载失败：${err.message || err}`;
        }
      );

      window.addEventListener('resize', () => {
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      water.material.uniforms['time'].value += dt;
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
