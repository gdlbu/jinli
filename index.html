<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>3D 锦鲤池（动态云层 & 发光锦鲤）</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000000; /* 与夜幕蓝天衔接 */
    }
    #loading {
      position: fixed; top:0; left:0; right:0; bottom:0;
      display: flex; align-items: center; justify-content: center;
      font: 1.2em sans-serif; color: #fff;
      background: #111111; z-index: 100;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/",
      "examples/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls }    from 'examples/controls/OrbitControls.js';
    import { GLTFLoader }       from 'examples/loaders/GLTFLoader.js';
    import { Water }            from 'examples/objects/Water.js';
    import { Sky }              from 'examples/objects/Sky.js';
    import { VolumetricCloud }  from 'examples/objects/VolumetricCloud.js';

    let scene, camera, renderer, clock, mixer, water, clouds;
    const loadingDiv = document.getElementById('loading');

    init();
    animate();

    function init() {
      if (location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器打开此页面';
        return;
      }

      // 场景、相机、时钟
      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
      camera.position.set(3, 10, 5);
      camera.lookAt(0, 0, 0);

      // 渲染器：关掉 toneMapping，用原生色彩
      renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById('canvas') });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.setClearColor(0x000000, 1);

      // 太阳位置（用于 Sky & 云层 & 水面反射）
      const sunPos = new THREE.Vector3().setFromSphericalCoords(
        1,
        Math.PI * 0.48,  // φ ≈86°，接近地平线
        Math.PI * 0.25   // θ ≈45°
      );

      // Sky Dome
      const sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);
      const su = sky.material.uniforms;
      su.turbidity.value       = 15;   // 强调晚霞
      su.rayleigh.value        = 2;    // 降低纯蓝
      su.mieCoefficient.value  = 0.02;
      su.mieDirectionalG.value = 0.9;
      su.sunPosition.value.copy(sunPos);

      // 环境贴图（仅 PBR 光照用）
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(sky).texture;

      // 动态体积云层
      clouds = new VolumetricCloud({
        width:  2000,
        height: 2000,
        depth:  500,
        segments: 64,
        slices:   20,
        cloudNoiseIntensity:  1.5,
        density:              0.5,
        cloudColor:           0xFFAA88,  // 晚霞橙
        skyColor:             0x000022,  // 夜幕蓝
        noiseScale:           0.8,
        noiseSpeed:           0.02,
        sunPosition:          sunPos.clone()
      });  
      scene.add(clouds.mesh);  // :contentReference[oaicite:0]{index=0}

      // 地面（沙底）
      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(200,200),
        new THREE.MeshStandardMaterial({ color:0xDDCBA0, roughness:1 })
      );
      sand.rotation.x = -Math.PI/2;
      scene.add(sand);

      // 水面
      const waterGeo = new THREE.PlaneGeometry(200,200);
      const waterNormals = new THREE.TextureLoader().load(
        'https://threejs.org/examples/textures/waternormals.jpg',
        tex => { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(16,16); }
      );
      water = new Water(waterGeo, {
        textureWidth: 2048, textureHeight: 2048,
        waterNormals,
        sunDirection: sunPos.clone().normalize(),
        sunColor: 0xFFBB88,      // 晚霞倒影色
        waterColor: 0x00CC77,    // 深度碧绿
        distortionScale: 3.2,
        fog: false
      });
      water.rotation.x = -Math.PI/2;
      water.position.y = 0.1;
      water.material.transparent = true;
      water.material.opacity = 0.85;
      scene.add(water);

      // 光照（暖色调）
      scene.add(new THREE.HemisphereLight(0xFFAA66, 0x222222, 0.3));
      const sun = new THREE.DirectionalLight(0xFFBB88, 0.8);
      sun.position.copy(sunPos).multiplyScalar(50);
      sun.castShadow = true;
      scene.add(sun);
      const rim = new THREE.DirectionalLight(0xFFFFFF, 0.15);
      rim.position.set(-10,10,-10);
      scene.add(rim);

      // 控制器
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 加载锦鲤，并增强调光
      const loader = new GLTFLoader();
      loader.load('koi.glb',
        gltf => {
          const fish = gltf.scene;
          fish.rotation.y = Math.PI;
          fish.scale.set(12,12,12);
          fish.position.y = 1.5;
          fish.traverse(n => {
            if (n.isMesh) {
              n.castShadow = true;
              n.material.emissive = new THREE.Color(0x444422);
              n.material.emissiveIntensity = 2.5;  // 强化自发光:contentReference[oaicite:1]{index=1}
            }
          });
          scene.add(fish);
          mixer = new THREE.AnimationMixer(fish);
          gltf.animations.forEach(a => mixer.clipAction(a).play());
          // 在鱼体中心添加点光，突出光晕
          const fishLight = new THREE.PointLight(0xFFFFFF, 1.2, 8);
          fishLight.position.set(0,2.5,0);
          fish.add(fishLight);
        },
        xhr => {
          if (xhr.lengthComputable) {
            loadingDiv.innerText = `加载中… ${Math.round(xhr.loaded/xhr.total*100)}%`;
          }
        },
        () => loadingDiv.innerText = '🚨 模型加载失败'
      );

      loadingDiv.style.display = 'none';
      window.addEventListener('resize', onResize);
    }

    function onResize() {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      mixer && mixer.update(dt);
      water  && (water.material.uniforms.time.value += dt);
      clouds && (clouds.material.uniforms.time.value += dt);  // 更新云层动画
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
