<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D 锦鲤池（碧绿湖水 & 蓝天白云）</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87CEEB; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#333;
      background:#87CEEB; z-index:100;
    }
    canvas { display:block }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader }  from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { Water }       from 'three/examples/jsm/objects/Water.js';
    import { Sky }         from 'three/examples/jsm/objects/Sky.js';

    let scene, camera, renderer, clock, mixer;
    let water, sky;
    const loadingDiv = document.getElementById('loading');
    const canvas     = document.getElementById('canvas');

    init();
    animate();

    function init() {
      // 场景、时钟、相机
      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 15);

      // 渲染器 + 阴影
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
      renderer.setClearColor(0x87CEEB);

      // 天空
      sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);
      const skyUniforms = sky.material.uniforms;
      skyUniforms['turbidity'].value = 10;
      skyUniforms['rayleigh'].value  = 2;
      skyUniforms['mieCoefficient'].value  = 0.005;
      skyUniforms['mieDirectionalG'].value = 0.8;
      // 太阳位置
      const sun = new THREE.Vector3();
      // 设置太阳在天空中稍偏东南的高位
      sun.setFromSphericalCoords(1, Math.PI * 0.4, Math.PI * 0.25);
      skyUniforms['sunPosition'].value.copy(sun);

      // 全局灯光
      const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
      scene.add(hemi);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.copy(sun).multiplyScalar(50);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.set(2048,2048);
      scene.add(dirLight);

      // 碧绿透明的湖水
      const waterGeo = new THREE.PlaneGeometry(1000, 1000);
      const waterNormals = new THREE.TextureLoader().load(
        'https://threejs.org/examples/textures/waternormals.jpg',
        tex => { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; }
      );
      water = new Water(waterGeo, {
        textureWidth: 512,
        textureHeight: 512,
        waterNormals: waterNormals,
        sunDirection: sun.clone().normalize(),
        sunColor: 0xffffff,
        waterColor: 0x00a86b,   // 碧绿色
        distortionScale: 3.0,
        fog: scene.fog !== undefined
      });
      water.rotation.x = -Math.PI/2;
      water.material.transparent = true;
      water.material.opacity     = 0.8;
      water.receiveShadow = true;
      scene.add(water);

      // 调试控制器
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.maxPolarAngle = Math.PI/2 - 0.1;

      // 地面影子接收（在水面之下放隐形平面接收）
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(1000,1000),
        new THREE.ShadowMaterial({ opacity: 0.3 })
      );
      ground.rotation.x = -Math.PI/2;
      ground.position.y = -0.01;
      ground.receiveShadow = true;
      scene.add(ground);

      // 加载锦鲤模型
      const loader = new GLTFLoader();
      const url    = `${window.location.origin}/koi.glb`;
      loader.load(
        url,
        gltf => {
          loadingDiv.style.display = 'none';
          const model = gltf.scene;
          // 鱼体再放大 2 倍（原 3 倍 -> 6 倍）
          model.scale.set(6, 6, 6);
          model.traverse(n => {
            if (n.isMesh) { n.castShadow = true; n.receiveShadow = false; }
          });
          scene.add(model);

          mixer = new THREE.AnimationMixer(model);
          console.log('动画片段：', gltf.animations.map(a=>a.name));
          gltf.animations.forEach(clip => {
            const action = mixer.clipAction(clip);
            action.play();
          });

          // 点击触发 Flee
          window.addEventListener('pointerdown', () => {
            const clip = gltf.animations.find(c=>/flee/i.test(c.name));
            if (clip) {
              const action = mixer.clipAction(clip);
              action.reset().play();
              action.clampWhenFinished = true;
              action.loop = THREE.LoopOnce;
            }
          });
        },
        xhr => {
          const pct = xhr.total ? Math.round(xhr.loaded/xhr.total*100) : 0;
          loadingDiv.innerText = `加载中… ${pct}%`;
        },
        err => {
          console.error('模型加载错误：', err);
          loadingDiv.innerText = `🚨 加载失败：${err.message||err}`;
        }
      );

      window.addEventListener('resize', () => {
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      water.material.uniforms['time'].value += dt;
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
