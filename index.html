<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D 锦鲤池（蔚蓝天空版）</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87CEEB; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#fff;
      background:#0077be; z-index:100;
    }
    canvas { display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/",
      "examples/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'examples/controls/OrbitControls.js';
    import { GLTFLoader }  from 'examples/loaders/GLTFLoader.js';
    import { Water }       from 'examples/objects/Water.js';
    import { Sky }         from 'examples/objects/Sky.js';

    let scene, camera, renderer, clock, mixer, water;
    const loadingDiv = document.getElementById('loading');

    init();
    animate();

    function init() {
      if (window.location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器打开此页面';
        return;
      }

      // 场景 & 相机 & 时钟
      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(3, 10, 5);
      camera.lookAt(0, 0, 0);

      // 渲染器（透明背景，以显示 CSS 里的 #87CEEB ）
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, canvas: document.getElementById('canvas') });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;  // 曝光调回 1
      renderer.setClearColor(0x000000, 0);

      // Sky Dome
      const sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);
      const su = sky.material.uniforms;
      su.turbidity.value      = 2;       // 降低大气浑浊度，清澈蔚蓝:contentReference[oaicite:2]{index=2}
      su.rayleigh.value       = 1;       // 强化蓝光散射:contentReference[oaicite:3]{index=3}
      su.mieCoefficient.value = 0.005;
      su.mieDirectionalG.value= 0.8;
      // 太阳位置：仰角更高，模拟正午天空更深蓝
      const sunPos = new THREE.Vector3().setFromSphericalCoords(
        1,
        Math.PI * 0.05,    // φ ≈ 9°
        Math.PI * 0.25     // θ ≈ 45°
      );
      su.sunPosition.value.copy(sunPos);

      // 环境贴图（只用于 PBR 光照）
      const pmremGen = new THREE.PMREMGenerator(renderer);
      const envMap = pmremGen.fromScene(sky).texture;
      scene.environment = envMap;
      // scene.background = envMap; // 保持注释，不用 envMap 作背景
      loadingDiv.style.display = 'none';

      // 灯光
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.3));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.copy(sunPos).multiplyScalar(50);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // 地面和水面同前...

      // 其余代码保持不变
      // ...
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      mixer && mixer.update(dt);
      water && water.material.uniforms && (water.material.uniforms.time.value += dt);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
