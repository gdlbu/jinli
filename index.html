<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>3D 锦鲤池</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#faf8f2; }
    #loading {
      position: fixed; top:0; left:0; right:0; bottom:0;
      display: flex; align-items:center; justify-content:center;
      background:#faf8f2; font-family:sans-serif; font-size:1.2em; z-index:100;
    }
  </style>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    // —— 全局变量 —— 
    let scene, camera, renderer, clock, mixer, swim, flee;
    const loadingDiv = document.getElementById('loading');

    // 页面加载后执行
    window.onload = function() {
      initThree();
      loadKoi();
      animate();
      window.addEventListener('resize', onResize);
    };

    // 初始化 Three.js 场景
    function initThree() {
      scene = new THREE.Scene();
      clock = new THREE.Clock();

      const W = window.innerWidth, H = window.innerHeight;
      camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 1000);
      camera.position.set(0, 5, 10);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(W, H);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      // 灯光
      const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(5,10,7);
      scene.add(dir);

      // 地面
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200,200),
        new THREE.MeshPhongMaterial({ color:0xe0dfd5, depthWrite:false })
      );
      ground.rotation.x = -Math.PI/2;
      scene.add(ground);

      // 控制器（可删）
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
    }

    // 加载 koi.glb
    function loadKoi() {
      const loader = new THREE.GLTFLoader();
      const url = 'koi.glb';
      console.log('开始加载：', url);
      loader.load(
        url,
        function(gltf) {
          console.log('加载完成', gltf);
          loadingDiv.style.display = 'none';

          const model = gltf.scene;
          model.scale.set(2,2,2);
          scene.add(model);

          mixer = new THREE.AnimationMixer(model);
          swim = mixer.clipAction(gltf.animations.find(c=>/swim/i.test(c.name)));
          flee = mixer.clipAction(gltf.animations.find(c=>/flee/i.test(c.name)));
          swim.play();

          window.addEventListener('pointerdown', () => {
            console.log('触发 flee');
            flee.reset().play();
            swim.stop();
            flee.clampWhenFinished = true;
            flee.loop = THREE.LoopOnce;
            mixer.addEventListener('finished', () => {
              console.log('flee 完成，恢复 swim');
              flee.stop();
              swim.reset().play();
            });
          });
        },
        function(xhr) {
          const pct = xhr.total ? Math.round(xhr.loaded/xhr.total*100) : 0;
          loadingDiv.innerText = `加载中… ${pct}%`;
          console.log(`进度: ${pct}%`);
        },
        function(err) {
          console.error('加载出错', err);
          loadingDiv.innerText = '🚨 模型加载失败，请检查 koi.glb';
        }
      );
    }

    // 渲染循环
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      renderer.render(scene, camera);
    }

    // 窗口尺寸变化
    function onResize() {
      const W = window.innerWidth, H = window.innerHeight;
      camera.aspect = W/H;
      camera.updateProjectionMatrix();
      renderer.setSize(W,H);
    }
  </script>
</body>
</html>
