<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中国风锦鲤水面动画</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #000;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
  import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

  let scene, camera, renderer, koiMesh, clock;

  init();
  animate();

  function init() {
    scene = new THREE.Scene();

    const loader = new THREE.TextureLoader();
    const bgTexture = loader.load('A_2D_digital_illustration_depicts_a_koi_fish_with_.png');
    scene.background = bgTexture;

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.set(0, 0, 5);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    clock = new THREE.Clock();

    // 模拟一个锦鲤精灵（简单几何体替代）
    const koiGeo = new THREE.CapsuleGeometry(0.3, 1.0, 4, 8);
    const koiMat = new THREE.MeshStandardMaterial({ color: 0xff9933 });
    koiMesh = new THREE.Mesh(koiGeo, koiMat);
    koiMesh.rotation.x = Math.PI / 2;
    scene.add(koiMesh);

    // 水面光照
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 10, 10);
    scene.add(light);

    window.addEventListener('resize', onWindowResize);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    koiMesh.position.x = Math.sin(t * 0.5) * 2.0;
    koiMesh.position.y = Math.cos(t * 0.3) * 0.5;
    koiMesh.rotation.z = Math.sin(t * 0.5) * 0.2;
    renderer.render(scene, camera);
  }
</script>
</body>
</html>
