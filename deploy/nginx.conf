# jin.li 静态站点 nginx 配置(东京 ARM 服务器)
# 用法: 拷到 /etc/nginx/sites-available/jinli 并软链到 sites-enabled,
#       站点根目录指向仓库检出位置;HTTPS 证书建议用 certbot 自动配置。

server {
    listen 80;
    listen [::]:80;
    server_name jin.li www.jin.li;

    root /var/www/jinli;
    index index.html;

    # 传输压缩: three.module.js 682KB -> ~168KB, app.js 40KB -> ~15KB
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/javascript application/json application/manifest+json
               image/svg+xml text/xml application/xml;

    # 非 nginx 默认的 MIME
    types {
        model/gltf-binary    glb;
        image/vnd.radiance   hdr;
    }

    # 大资源基本不变,长缓存;改版时改文件名即可
    location ~* \.(glb|hdr|jpg|png|svg|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.js$ {
        expires 1d;
        add_header Cache-Control "public";
    }
    # HTML 不缓存,保证发版即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
