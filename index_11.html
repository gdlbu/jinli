<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D 锦鲤池（相机(3,12,0)，鱼头朝向 -Z）</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87CEEB; }
    #loading {
      position:fixed; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      font-family:sans-serif; font-size:1.2em; color:#fff;
      background:#0077be; z-index:100;
    }
    canvas { display:block; }
  </style>
  <!-- 重点：本地 importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "/three/three.module.js",
      "three/": "/three/",
      "examples/": "/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">加载中… 0%</div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'examples/controls/OrbitControls.js';
    import { GLTFLoader }  from 'examples/loaders/GLTFLoader.js';
    import { Water }       from 'examples/objects/Water.js';
    import { Sky }         from 'examples/objects/Sky.js';

    let scene, camera, renderer, clock, mixer, water;
    const loadingDiv = document.getElementById('loading');

    init();
    animate();

    function init() {
      if (window.location.protocol === 'file:') {
        loadingDiv.innerText = '⚠️ 请通过 HTTP 服务器打开此页面';
        return;
      }

      // 场景 & 时钟 & 相机
      scene = new THREE.Scene();
      clock = new THREE.Clock();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(1, 12, 3);
      camera.lookAt(0, 0, 0);

      // 渲染器
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, canvas: document.getElementById('canvas') });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.6;
      renderer.setClearColor(0x0077be, 1);

      // Sky Dome
      const sky = new Sky();
      sky.scale.setScalar(10000);
      scene.add(sky);
      const su = sky.material.uniforms;
      su.turbidity.value       = 10;
      su.rayleigh.value        = 2;
      su.mieCoefficient.value  = 0.005;
      su.mieDirectionalG.value = 0.8;
      const sunPos = new THREE.Vector3().setFromSphericalCoords(1, Math.PI * 0.4, Math.PI * 0.25);
      su.sunPosition.value.copy(sunPos);

      // 环境贴图 & 背景（可选：如你有静态贴图可替换）
      const pmremGen = new THREE.PMREMGenerator(renderer);
      const envMap = pmremGen.fromScene(sky).texture;
      scene.environment = envMap;
      scene.background = envMap;
      loadingDiv.style.display = 'none';

      // 光照
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.3));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.copy(sunPos).multiplyScalar(50);
      dirLight.castShadow = true;
      scene.add(dirLight);
      const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
      rimLight.position.set(-10, 10, -10);
      scene.add(rimLight);

      // 沙底
      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: 0xDDCBA0, roughness: 1 })
      );
      sand.rotation.x = -Math.PI/2;
      scene.add(sand);

      // 果冻海水面
      const waterGeo = new THREE.PlaneGeometry(200, 200);
      // 重点：waternormals.jpg 本地路径
      const waterNormals = new THREE.TextureLoader().load(
        '/textures/waternormals.jpg',
        tex => { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(16, 16); }
      );
      water = new Water(waterGeo, {
        textureWidth: 1024, // 推荐优化
        textureHeight: 1024,
        waterNormals,
        sunDirection: sunPos.clone().normalize(),
        sunColor: 0xffffff,
        waterColor: 0x40E0D0,
        distortionScale: 3.2,
        fog: false
      });
      water.rotation.x = -Math.PI/2;
      water.position.y = 2;
      water.material.transparent = true;
      water.material.opacity = 0.95;
      scene.add(water);

      // 控制器
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 加载锦鲤模型 & 初始朝向调整（本地路径！）
      const loader = new GLTFLoader();
      loader.load(
        '/models/koi.glb',
        gltf => {
          gltf.scene.rotation.y = Math.PI;
          mixer = new THREE.AnimationMixer(gltf.scene);
          gltf.animations.forEach(c => mixer.clipAction(c).play());
          gltf.scene.scale.set(12, 12, 12);
          gltf.scene.position.y = water.position.y+1;
          gltf.scene.traverse(n => n.isMesh && (n.castShadow = true));
          scene.add(gltf.scene);
          loadingDiv.style.display = 'none';
        },
        xhr => {
          if (xhr.lengthComputable) {
            const pct = Math.round(xhr.loaded / xhr.total * 100);
            loadingDiv.innerText = `加载中… ${pct}%`;
          } else {
            const kb = (xhr.loaded / 1024).toFixed(1);
            loadingDiv.innerText = `加载中… ${kb} KB`;
          }
        },
        err => loadingDiv.innerText = '🚨 模型加载失败'
      );

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      mixer && mixer.update(dt);
      water && water.material.uniforms && (water.material.uniforms.time.value += dt*.4);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
